<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程小幫手</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #0f172a 0%, #030712 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f8fafc;
            position: relative;
            overflow-x: hidden;
        }
        /* 全屏微光動態移動星空效果 */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50px 160px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #818cf8, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #a7f3d0, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 210px 190px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 260px 40px, #c084fc, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 310px 140px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 370px 80px, #60a5fa, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 420px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 470px 60px, #f472b6, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 320px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 0;
            animation: starsMoveDrift 55s linear infinite alternate, starsTwinklePulse 6s ease-in-out infinite alternate;
        }

        /* 雙層慢速星雲與微小遠星層 */
        body::after {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                radial-gradient(circle at 75% 25%, rgba(99, 102, 241, 0.15), transparent 45%),
                radial-gradient(circle at 25% 75%, rgba(16, 185, 129, 0.12), transparent 45%),
                radial-gradient(1px 1px at 80px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 190px 220px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 340px 90px, #f472b6, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 450px 270px, #a7f3d0, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 600px 400px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            animation: nebulaDrift 75s ease-in-out infinite alternate;
        }

        @keyframes starsMoveDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, -75px) scale(1.02); }
            100% { transform: translate(40px, -130px) scale(1); }
        }
        @keyframes starsTwinklePulse {
            0% { opacity: 0.45; }
            50% { opacity: 0.85; }
            100% { opacity: 0.55; }
        }
        @keyframes nebulaDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(60px, 40px) scale(1.05); opacity: 0.8; }
            100% { transform: translate(-40px, -50px) scale(1); opacity: 0.55; }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
            color: #f1f5f9;
        }
        .btn-line {
            background: linear-gradient(135deg, #1DB446 0%, #10b981 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 14px rgba(29, 180, 70, 0.4);
            transition: all 0.3s ease;
        }
        .btn-line:hover {
            background: linear-gradient(135deg, #158b32 0%, #059669 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 180, 70, 0.6);
        }
        .nav-tabs {
            border-bottom: none;
        }
        .nav-tabs .nav-link {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            font-weight: bold;
            border-radius: 50px;
            margin: 0 3px;
            padding: 8px 14px;
            font-size: 0.85rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #1DB446 0%, #059669 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 14px rgba(29, 180, 70, 0.4);
        }
        .badge-tab-count {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 50px;
        }
        .badge-eat { background-color: #f97316; }
        .badge-exhibit { background-color: #8b5cf6; }
        .badge-sport { background-color: #ef4444; }
        .badge-travel { background-color: #10b981; }
        .badge-movie { background-color: #06b6d4; }
        .badge-other { background-color: #64748b; }

        .schedule-item {
            border-left: 5px solid #1DB446;
            background: rgba(30, 41, 59, 0.88);
            color: #f8fafc;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .schedule-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #1DB446;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="py-4">
    <div class="container position-relative" style="max-width: 520px; z-index: 1;">
        <!-- 載入中畫面 -->
        <div id="loading-section" class="text-center py-5">
            <div class="loader d-inline-block"></div>
            <p class="mt-3 text-light fw-bold">正在讀取 LINE 個人檔案與行程中...</p>
        </div>

        <!-- 主要列表畫面 -->
        <div id="main-section" class="d-none">
            <!-- 帳號未綁定提示橫幅 -->
            <div id="bind-warning-banner" class="alert alert-warning py-2 px-3 mb-3 small d-none" style="border-radius: 12px; border: 1px solid #ffeeba; background-color: rgba(255, 243, 205, 0.95); color: #856404;">
                <i class="fa-solid fa-triangle-exclamation me-1 text-warning"></i> 
                目前使用臨時帳號。
                <a href="/line/liff/bind/" id="bind-link" class="alert-link text-decoration-none fw-bold ms-1" style="color: #533f03;"><i class="fa-solid fa-link me-1"></i>點此安全連結 Google 帳號</a>
            </div>

            <!-- 頂部 Header -->
            <div class="glass-card p-4 mb-4 text-center position-relative">
                <h3 class="fw-bold mb-1 text-white"><i class="fa-regular fa-calendar-check text-success me-2"></i>行程小幫手</h3>
                <p id="group-title" class="text-light text-opacity-75 small mb-0"><i class="fa-solid fa-users me-1"></i>個人行程看板</p>
                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <span class="text-light small">Hi, <span id="user-display-name" class="fw-bold text-success">LINE 用戶</span></span>
                    <a href="/line/liff/create/" id="add-btn" class="btn btn-sm btn-line px-3"><i class="fa-solid fa-plus me-1"></i>新增行程</a>
                </div>
            </div>

            <!-- 分頁 Tab (附總筆數 Badges) -->
            <ul class="nav nav-tabs justify-content-center mb-3" id="scheduleTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="upcoming-tab" data-bs-toggle="tab" data-bs-target="#upcoming-panel" type="button" role="tab" onclick="switchTab('upcoming')">
                        🔔 即將到來 <span id="badge-upcoming-count" class="badge badge-tab-count bg-white text-dark ms-1">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="unscheduled-tab" data-bs-toggle="tab" data-bs-target="#unscheduled-panel" type="button" role="tab" onclick="switchTab('unscheduled')">
                        🌟 有興趣/未定 <span id="badge-unscheduled-count" class="badge badge-tab-count bg-white text-dark ms-1">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-panel" type="button" role="tab" onclick="switchTab('history')">
                        📅 歷史紀錄 <span id="badge-history-count" class="badge badge-tab-count bg-white text-dark ms-1">0</span>
                    </button>
                </li>
            </ul>

            <!-- 行程清單 Panel -->
            <div class="tab-content" id="scheduleTabContent">
                <!-- 即將到來行程 -->
                <div class="tab-pane fade show active" id="upcoming-panel" role="tabpanel">
                    <div id="upcoming-list" class="d-flex flex-column gap-3">
                        <!-- 動態插入 -->
                    </div>
                    <!-- 底部分頁與顯示數量控制項 -->
                    <div id="upcoming-pagination" class="glass-card p-3 mt-3 d-flex flex-column gap-2 d-none" style="border-radius: 16px;">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="small text-light">
                                共 <span id="upcoming-total-count" class="fw-bold text-success">0</span> 筆 ‧ 
                                第 <span id="upcoming-page-num" class="text-success fw-bold">1</span> / <span id="upcoming-total-pages" class="text-success fw-bold">1</span> 頁
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">每頁：</span>
                                <select id="upcoming-pagesize-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="changeTabPageSize('upcoming', this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10">10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="upcoming-prev-btn" onclick="changePage('upcoming', -1)" style="font-size: 0.8rem;">
                                <i class="fa-solid fa-chevron-left me-1"></i>上一頁
                            </button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">頁數：</span>
                                <select id="upcoming-page-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="goToTabSelectedPage('upcoming', this.value)">
                                    <option value="1">1</option>
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="upcoming-next-btn" onclick="changePage('upcoming', 1)" style="font-size: 0.8rem;">
                                下一頁<i class="fa-solid fa-chevron-right ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 時間待定/有興趣行程 -->
                <div class="tab-pane fade" id="unscheduled-panel" role="tabpanel">
                    <div id="unscheduled-list" class="d-flex flex-column gap-3">
                        <!-- 動態插入 -->
                    </div>
                    <!-- 底部分頁與顯示數量控制項 -->
                    <div id="unscheduled-pagination" class="glass-card p-3 mt-3 d-flex flex-column gap-2 d-none" style="border-radius: 16px;">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="small text-light">
                                共 <span id="unscheduled-total-count" class="fw-bold text-success">0</span> 筆 ‧ 
                                第 <span id="unscheduled-page-num" class="text-success fw-bold">1</span> / <span id="unscheduled-total-pages" class="text-success fw-bold">1</span> 頁
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">每頁：</span>
                                <select id="unscheduled-pagesize-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="changeTabPageSize('unscheduled', this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10">10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="unscheduled-prev-btn" onclick="changePage('unscheduled', -1)" style="font-size: 0.8rem;">
                                <i class="fa-solid fa-chevron-left me-1"></i>上一頁
                            </button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">頁數：</span>
                                <select id="unscheduled-page-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="goToTabSelectedPage('unscheduled', this.value)">
                                    <option value="1">1</option>
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="unscheduled-next-btn" onclick="changePage('unscheduled', 1)" style="font-size: 0.8rem;">
                                下一頁<i class="fa-solid fa-chevron-right ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 歷史紀錄 -->
                <div class="tab-pane fade" id="history-panel" role="tabpanel">
                    <div id="history-list" class="d-flex flex-column gap-3">
                        <!-- 動態插入 -->
                    </div>
                    <!-- 底部分頁與顯示數量控制項 -->
                    <div id="history-pagination" class="glass-card p-3 mt-3 d-flex flex-column gap-2 d-none" style="border-radius: 16px;">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="small text-light">
                                共 <span id="history-total-count" class="fw-bold text-success">0</span> 筆 ‧ 
                                第 <span id="history-page-num" class="text-success fw-bold">1</span> / <span id="history-total-pages" class="text-success fw-bold">1</span> 頁
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">每頁：</span>
                                <select id="history-pagesize-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="changeTabPageSize('history', this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10">10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="history-prev-btn" onclick="changePage('history', -1)" style="font-size: 0.8rem;">
                                <i class="fa-solid fa-chevron-left me-1"></i>上一頁
                            </button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-light text-opacity-75" style="font-size: 0.75rem;">頁數：</span>
                                <select id="history-page-select" class="form-select form-select-sm bg-dark text-white border-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem; width: auto;" onchange="goToTabSelectedPage('history', this.value)">
                                    <option value="1">1</option>
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" id="history-next-btn" onclick="changePage('history', 1)" style="font-size: 0.8rem;">
                                下一頁<i class="fa-solid fa-chevron-right ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let liffId = "{{ liff_id }}";
        let userAccessToken = null;
        let lineContext = null;

        // 分頁與每頁顯示筆數狀態追蹤
        let tabState = {
            upcoming: { page: 1, pageSize: 5, totalPages: 1, totalCount: 0 },
            unscheduled: { page: 1, pageSize: 5, totalPages: 1, totalCount: 0 },
            history: { page: 1, pageSize: 5, totalPages: 1, totalCount: 0 }
        };
        let currentActiveTab = "upcoming";

        // 解析 URL 中的 groupId 參數
        const urlParams = new URLSearchParams(window.location.search);
        const urlGroupId = urlParams.get("groupId");

        document.addEventListener("DOMContentLoaded", function() {
            const pageParam = urlParams.get("page");
            if (pageParam === "drama") {
                urlParams.set("_t", new Date().getTime());
                window.location.href = `/line/liff/drama/?${urlParams.toString()}`;
                return;
            }
            if (pageParam === "pet") {
                urlParams.set("_t", new Date().getTime());
                window.location.href = `/line/liff/pet/?${urlParams.toString()}`;
                return;
            }
            initLiff();
        });

        function initLiff() {
            liff.init({ liffId: liffId })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        userAccessToken = liff.getAccessToken();
                        lineContext = liff.getContext();
                        
                        const addBtn = document.getElementById("add-btn");
                        const currentGroupId = urlGroupId || (lineContext ? lineContext.groupId : null);
                        if (currentGroupId) {
                            addBtn.href = `/line/liff/create/?groupId=${currentGroupId}`;
                            document.getElementById("group-title").innerHTML = `<i class="fa-solid fa-users me-1"></i>群組共享行程`;
                        }

                        // 首次載入：請求所有分頁資料
                        fetchItineraries("upcoming");
                        fetchItineraries("unscheduled");
                        fetchItineraries("history");
                        
                        checkUrlActions();
                    }
                })
                .catch((err) => {
                    console.error("LIFF initialization failed", err);
                    alert("LIFF 啟動失敗，請於 LINE 內開啟！");
                });
        }

        function switchTab(tab) {
            currentActiveTab = tab;
        }

        function fetchItineraries(tab) {
            let groupId = urlGroupId || (lineContext ? lineContext.groupId : null);
            const state = tabState[tab];

            const listContainer = document.getElementById(`${tab}-list`);
            listContainer.innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            `;
            
            fetch("/line/api/itineraries/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    access_token: userAccessToken,
                    group_id: groupId,
                    tab: tab,
                    page: state.page,
                    page_size: state.pageSize
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("loading-section").classList.add("d-none");
                
                if (data.error) {
                    alert("取得資料失敗: " + data.error);
                    return;
                }

                if (!data.is_bound) {
                    let bindUrl = `/line/liff/bind/`;
                    if (groupId) {
                        bindUrl += `?groupId=${groupId}`;
                    }
                    window.location.href = bindUrl;
                    return;
                }

                document.getElementById("user-display-name").innerText = data.username;
                document.getElementById("main-section").classList.remove("d-none");

                if (data.is_temporary) {
                    const bindLink = document.getElementById("bind-link");
                    if (groupId) {
                        bindLink.href = `/line/liff/bind/?groupId=${groupId}`;
                    } else {
                        bindLink.href = `/line/liff/bind/`;
                    }
                    document.getElementById("bind-warning-banner").classList.remove("d-none");
                } else {
                    document.getElementById("bind-warning-banner").classList.add("d-none");
                }

                // 更新頁籤總筆數 Badge
                if (data.counts) {
                    document.getElementById("badge-upcoming-count").innerText = data.counts.upcoming || 0;
                    document.getElementById("badge-unscheduled-count").innerText = data.counts.unscheduled || 0;
                    document.getElementById("badge-history-count").innerText = data.counts.history || 0;
                }

                // 更新狀態變數
                state.page = data.page || 1;
                state.pageSize = data.page_size || 5;
                state.totalCount = data.total_count || 0;
                state.totalPages = data.total_pages || 1;

                // 渲染行程卡片清單
                renderList(data.list, `${tab}-list`, tab === "upcoming");
                
                // 更新底部分頁控制項
                updatePaginationControls(tab);
            })
            .catch(err => {
                console.error("Error fetching data:", err);
                listContainer.innerHTML = `
                    <div class="alert alert-danger text-center small my-2" style="background: rgba(220,53,69,0.2); border-color: #dc3545; color: #ff8585;">
                        伺服器連線失敗，請重試！
                    </div>
                `;
            });
        }

        function updatePaginationControls(tab) {
            const state = tabState[tab];
            const paginationDiv = document.getElementById(`${tab}-pagination`);
            
            document.getElementById(`${tab}-total-count`).innerText = state.totalCount;
            document.getElementById(`${tab}-page-num`).innerText = state.page;
            document.getElementById(`${tab}-total-pages`).innerText = state.totalPages;
            
            // 同步每頁顯示選單選取值
            const sizeSelect = document.getElementById(`${tab}-pagesize-select`);
            if (sizeSelect) sizeSelect.value = state.pageSize;

            // 建立直達頁數下拉選單選項
            const pageSelect = document.getElementById(`${tab}-page-select`);
            if (pageSelect) {
                pageSelect.innerHTML = "";
                for (let i = 1; i <= state.totalPages; i++) {
                    const opt = document.createElement("option");
                    opt.value = i;
                    opt.innerText = i;
                    if (i === state.page) opt.selected = true;
                    pageSelect.appendChild(opt);
                }
            }

            // 上一頁與下一頁按鈕啟用狀態
            const prevBtn = document.getElementById(`${tab}-prev-btn`);
            const nextBtn = document.getElementById(`${tab}-next-btn`);
            prevBtn.disabled = (state.page <= 1);
            nextBtn.disabled = (state.page >= state.totalPages);
            
            paginationDiv.classList.remove("d-none");
        }

        function changeTabPageSize(tab, val) {
            const newSize = parseInt(val);
            if ([5, 10, 20].includes(newSize)) {
                tabState[tab].pageSize = newSize;
                tabState[tab].page = 1;
                fetchItineraries(tab);
            }
        }

        function goToTabSelectedPage(tab, val) {
            const newPage = parseInt(val);
            if (newPage >= 1 && newPage <= tabState[tab].totalPages) {
                tabState[tab].page = newPage;
                fetchItineraries(tab);
            }
        }

        function changePage(tab, offset) {
            const state = tabState[tab];
            let newPage = state.page + offset;
            if (newPage >= 1 && newPage <= state.totalPages) {
                state.page = newPage;
                fetchItineraries(tab);
            }
        }

        function makeGoogleCalendarUrl(item) {
            const base = "https://www.google.com/calendar/render?action=TEMPLATE";
            const text = encodeURIComponent(item.title);
            const location = encodeURIComponent(item.location || "待定");
            const details = encodeURIComponent(item.notes || "");
            
            const dtStr = item.date_time.replace(/[^0-9]/g, "");
            if (dtStr.length >= 12) {
                const year = dtStr.substring(0, 4);
                const month = dtStr.substring(4, 6);
                const day = dtStr.substring(6, 8);
                const hour = dtStr.substring(8, 10);
                const min = dtStr.substring(10, 12);
                
                const startDate = `${year}${month}${day}T${hour}${min}00`;
                
                const end = new Date(year, month - 1, day, hour, min);
                end.setHours(end.getHours() + 1);
                
                const ey = end.getFullYear();
                const em = String(end.getMonth() + 1).padStart(2, '0');
                const ed = String(end.getDate()).padStart(2, '0');
                const eh = String(end.getHours()).padStart(2, '0');
                const emn = String(end.getMinutes()).padStart(2, '0');
                const endDate = `${ey}${em}${ed}T${eh}${emn}00`;
                
                return `${base}&text=${text}&dates=${startDate}/${endDate}&location=${location}&details=${details}`;
            }
            return `${base}&text=${text}&location=${location}&details=${details}`;
        }

                        Swal.fire({ title: '錯誤', text: '載入邀請行程失敗: ' + data.error, icon: 'error', background: '#0f172a', color: '#fff' });
                    }
                });
            }
        }
    </script>
</body>
