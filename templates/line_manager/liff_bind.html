<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號綁定 - 行程小幫手</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            width: 100%;
            max-width: 450px;
        }
        .btn-line {
            background-color: #1DB446;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-line:hover {
            background-color: #158b32;
            color: white;
            transform: translateY(-2px);
        }
        .form-control {
            border-radius: 10px;
        }

        /* LIFF 精緻下拉導覽選單樣式 */
        .liff-nav-card,
        .glass-card:has(.liff-nav-dropdown) {
            position: relative;
            z-index: 1050;
        }
        .liff-nav-dropdown {
            position: relative;
            z-index: 1060;
        }
        .liff-nav-dropdown .dropdown-toggle {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #334155;
            border-radius: 50px;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .liff-nav-dropdown .dropdown-toggle:hover,
        .liff-nav-dropdown .dropdown-toggle:focus,
        .liff-nav-dropdown .dropdown-toggle[aria-expanded="true"] {
            background: rgba(0, 0, 0, 0.1);
            border-color: #0284c7;
            color: #0284c7;
        }
        .liff-nav-dropdown .dropdown-menu {
            background: rgba(15, 23, 42, 0.98) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            border-radius: 14px !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75) !important;
            padding: 6px !important;
            width: max-content !important;
            min-width: 230px !important;
            max-width: min(340px, 90vw) !important;
            max-height: calc(100vh - 120px) !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            z-index: 99999 !important;
            animation: liffDropdownFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .liff-nav-dropdown .dropdown-menu::-webkit-scrollbar {
            width: 4px;
        }
        .liff-nav-dropdown .dropdown-menu::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.35);
            border-radius: 4px;
        }
        @keyframes liffDropdownFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .liff-nav-dropdown .dropdown-item {
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.84rem;
            font-weight: 500;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap;
        }
        .liff-nav-dropdown .dropdown-item span:first-child {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .liff-nav-dropdown .dropdown-item:hover,
        .liff-nav-dropdown .dropdown-item:focus {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .liff-nav-dropdown .dropdown-item.active-nav-item {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(99, 102, 241, 0.25));
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #38bdf8;
            font-weight: 600;
        }
        .liff-nav-dropdown .dropdown-item.active-nav-item:hover,
        .liff-nav-dropdown .dropdown-item.active-nav-item:focus {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.32), rgba(99, 102, 241, 0.32));
            color: #38bdf8;
        }
        .liff-nav-dropdown .dropdown-item .badge {
            flex-shrink: 0;
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            background: rgba(14, 165, 233, 0.35) !important;
            color: #38bdf8 !important;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .liff-nav-dropdown .dropdown-header {
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 3px 8px 4px;
        }
        .liff-nav-dropdown .dropdown-divider {
            border-color: rgba(255, 255, 255, 0.12);
            margin: 4px 2px;
        }
    </style>
</head>
<body class="py-4">
    <div class="container d-flex justify-content-center">
        <div class="glass-card p-4 liff-nav-card" style="position: relative; z-index: 1050;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a href="/line/liff/" class="btn btn-sm btn-outline-secondary rounded-pill px-3 shadow-sm" style="font-size: 0.82rem;">
                    <i class="fa-solid fa-arrow-left me-1"></i>返回行程
                </a>
                <!-- LIFF 服務導覽下拉選單 -->
                <div class="dropdown liff-nav-dropdown">
                    <button class="btn dropdown-toggle" type="button" id="liffNavDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-compass text-info"></i>
                        <span>服務導覽</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="liffNavDropdown">
                        <li><h6 class="dropdown-header"><i class="fa-solid fa-layer-group me-1"></i>快捷服務導覽</h6></li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/">
                                <span><i class="fa-regular fa-calendar-check me-2 text-success"></i>行程小幫手</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=drama">
                                <span><i class="fa-solid fa-tv me-2 text-info"></i>追劇小幫手</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=nutrition">
                                <span><i class="fa-solid fa-seedling me-2 text-success"></i>食品營養百科</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=gnn">
                                <span><i class="fa-solid fa-gamepad me-2 text-warning"></i>GNN 動漫情報</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=novel">
                                <span><i class="fa-solid fa-book-open me-2 text-primary"></i>輕小說瀏覽器</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=music">
                                <span><i class="fa-solid fa-compact-disc me-2 text-danger"></i>酷炫音樂平台</span>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" href="/line/liff/?page=pet">
                                <span><i class="fa-solid fa-paw me-2 text-primary"></i>休閒小站桌寵</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <h4 class="fw-bold mb-3 text-center text-success"><i class="fa-solid fa-link me-2"></i>帳號安全性綁定</h4>
            <p class="text-muted text-center small mb-4">為了保護您的行程隱私，請將您的 LINE 帳號與 CSI Portal 帳號進行安全性連結。</p>

            <form id="bind-form">
                <!-- 帳號 -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">CSI 系統帳號</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="username" placeholder="請輸入使用者名稱" required>
                    </div>
                </div>

                <!-- 密碼 -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">系統密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" placeholder="請輸入密碼" required>
                    </div>
                </div>

                <!-- 登入綁定按鈕 -->
                <button type="submit" class="btn btn-line w-100 mb-3 py-2"><i class="fa-solid fa-link-slash me-2"></i>登入並完成安全綁定</button>
            </form>

            <div class="text-center text-muted mb-3">—— 或 ——</div>

            <!-- 一鍵註冊新帳號 -->
            <button id="auto-register-btn" class="btn btn-outline-success w-100 py-2 mb-3" style="border-radius: 50px;">
                <i class="fa-solid fa-user-plus me-2"></i>一鍵建立新帳號並綁定
            </button>

            <!-- 以 Google 帳號合併綁定 -->
            <button id="google-bind-btn" class="btn btn-outline-danger w-100 py-2" style="border-radius: 50px; border-color: #ea4335; color: #ea4335;">
                <i class="fa-brands fa-google me-2"></i>使用網站 Google 帳號合併綁定
            </button>
        </div>
    </div>

    <script>
        let liffId = "{{ liff_id }}";
        let userAccessToken = null;
        let lineContext = null;

        // 從 URL 取得 groupId
        const urlParams = new URLSearchParams(window.location.search);
        const urlGroupId = urlParams.get("groupId");

        document.addEventListener("DOMContentLoaded", function() {
            initLiff();
        });

        function initLiff() {
            liff.init({ liffId: liffId })
                .then(() => {
                    if (liff.isLoggedIn()) {
                        userAccessToken = liff.getAccessToken();
                        lineContext = liff.getContext();

                        // 檢查是否有待執行的 Google 帳號綁定動作 (優先自 localStorage 讀取以防重導向遺失參數)
                        const pendingAction = localStorage.getItem("pending_action") || urlParams.get("action");
                        if (pendingAction === "google_bind") {
                            localStorage.removeItem("pending_action"); // 立即清除防止重複觸發
                            bindCurrentUser();
                        }
                    } else {
                        liff.login();
                    }
                })
                .catch((err) => {
                    console.error("LIFF failed to initialize", err);
                });
        }

        // 綁定當前 Session 用戶 (Google 登入用戶)
        function bindCurrentUser() {
            fetch("/line/api/bind/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    access_token: userAccessToken,
                    action: "bind_current_user",
                    group_id: urlGroupId || (lineContext ? lineContext.groupId : null)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    Swal.fire('錯誤', "Google 帳號合併綁定失敗: " + data.error, 'error');
                } else {
                    Swal.fire({
                        title: '成功',
                        text: 'Google 帳號合併與歷史行程移轉成功！',
                        icon: 'success',
                        confirmButtonColor: '#1DB446',
                        confirmButtonText: '確定'
                    }).then(() => {
                        redirectToList();
                    });
                }
            })
            .catch(err => {
                console.error("Google bind error:", err);
                Swal.fire('錯誤', "伺服器連線失敗", 'error');
            });
        }

        // 處理帳密綁定
        document.getElementById("bind-form").addEventListener("submit", function(e) {
            e.preventDefault();

            if (!userAccessToken) {
                Swal.fire('未授權', 'LINE 未授權，請重試', 'warning');
                return;
            }

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            fetch("/line/api/bind/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    access_token: userAccessToken,
                    action: "bind",
                    username: username,
                    password: password,
                    group_id: urlGroupId || (lineContext ? lineContext.groupId : null)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    Swal.fire('錯誤', "綁定失敗: " + data.error, 'error');
                } else {
                    Swal.fire({
                        title: '成功',
                        text: '帳號安全綁定成功！',
                        icon: 'success',
                        confirmButtonColor: '#1DB446',
                        confirmButtonText: '確定'
                    }).then(() => {
                        redirectToList();
                    });
                }
            })
            .catch(err => {
                console.error("Bind error:", err);
                Swal.fire('錯誤', "伺服器連線失敗", 'error');
            });
        });

        // 處理一鍵自動註冊
        document.getElementById("auto-register-btn").addEventListener("click", function() {
            if (!userAccessToken) {
                Swal.fire('未授權', 'LINE 未授權，請重試', 'warning');
                return;
            }

            Swal.fire({
                title: '建立專屬帳號',
                text: '系統將會為您建立一個專屬的 LINE 登入帳號，確定要繼續嗎？',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#1DB446',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '確定',
                cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch("/line/api/bind/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            access_token: userAccessToken,
                            action: "auto_register",
                            group_id: urlGroupId || (lineContext ? lineContext.groupId : null)
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.error) {
                            Swal.fire('錯誤', "一鍵建立帳號失敗: " + data.error, 'error');
                        } else {
                            Swal.fire({
                                title: '成功',
                                text: '專屬帳號建立並綁定成功！',
                                icon: 'success',
                                confirmButtonColor: '#1DB446',
                                confirmButtonText: '確定'
                            }).then(() => {
                                redirectToList();
                            });
                        }
                    })
                    .catch(err => {
                        console.error("Auto register error:", err);
                        Swal.fire('錯誤', "伺服器連線失敗", 'error');
                    });
                }
            });
        });

        function redirectToList() {
            const groupId = urlGroupId || (lineContext ? lineContext.groupId : null);
            let listUrl = `/line/liff/`;
            if (groupId && groupId.startsWith("C") && !groupId.includes("-")) {
                listUrl += `?groupId=${groupId}`;
            }
            window.location.href = listUrl;
        }

        // Google 登入綁定按鈕監聽
        document.getElementById("google-bind-btn").addEventListener("click", function() {
            const groupId = urlGroupId || (lineContext ? lineContext.groupId : null);
            let nextUrl = `/line/liff/bind/?action=google_bind`;
            if (groupId && groupId.startsWith("C") && !groupId.includes("-")) {
                nextUrl += `&groupId=${groupId}`;
            }
            
            // 由於 Google 安全政策阻擋 LINE 內嵌 WebView 瀏覽器 (disallowed_useragent)，
            // 我們必須使用 LIFF SDK 強迫將 Google 登入連結用「外部系統瀏覽器 (Safari/Chrome)」開啟
            const absoluteNextUrl = window.location.origin + nextUrl;
            const googleLoginUrl = window.location.origin + `/accounts/google/login/?process=connect&next=${encodeURIComponent(absoluteNextUrl)}`;
            
            // 儲存狀態至 localStorage，跨越 Google 與 LINE 登入多次重導向依然有效
            localStorage.setItem("pending_action", "google_bind");

            Swal.fire({
                title: '引導至外部瀏覽器',
                text: '因 Google 安全政策限制，即將為您在外部瀏覽器開啟 Google 安全登入。本網頁將自動關閉，請在外部網頁完成登入後，返回 LINE 重新開啟行程看板即可！',
                icon: 'info',
                confirmButtonColor: '#1DB446',
                confirmButtonText: '確定並關閉網頁'
            }).then(() => {
                if (liff.isInClient()) {
                    liff.openWindow({
                        url: googleLoginUrl,
                        external: true
                    });
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 500); // 延遲半秒關閉 WebView，確保外部瀏覽器已成功開啟
                } else {
                    // 如果本來就在外部瀏覽器，直接重導向
                    window.location.href = googleLoginUrl;
                }
            });
        });
    </script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
