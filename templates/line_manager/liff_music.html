<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Studio - 酷炫音樂影音平台</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(18, 22, 31, 0.85);
            --neon-blue: #00f2fe;
            --neon-purple: #9b51e0;
            --neon-pink: #ff0844;
            --gold-accent: #ffd700;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(155, 81, 224, 0.18) 0%, transparent 45%);
            color: #fff;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: 50px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        /* 3D 黑金 CD 旋轉唱片 */
        .cd-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #111, #222);
            padding: 8px;
            box-shadow: 0 0 30px rgba(155, 81, 224, 0.5), inset 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .cd-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, #1a1a1a, #1a1a1a 3px, #0d0d0d 6px, #0d0d0d 9px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .cd-disc.playing {
            animation-play-state: running;
        }
        .cd-center {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: 4px solid #111;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 音樂頻譜波形 bar */
        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 32px;
            margin-top: 15px;
        }
        .eq-bar {
            width: 6px;
            background: linear-gradient(to top, var(--neon-blue), var(--neon-purple));
            border-radius: 4px;
            height: 8px;
            transition: height 0.15s ease;
        }
        .playing .eq-bar:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
        .playing .eq-bar:nth-child(2) { animation: eq 0.6s ease-in-out infinite alternate 0.2s; }
        .playing .eq-bar:nth-child(3) { animation: eq 1.1s ease-in-out infinite alternate 0.4s; }
        .playing .eq-bar:nth-child(4) { animation: eq 0.7s ease-in-out infinite alternate 0.1s; }
        .playing .eq-bar:nth-child(5) { animation: eq 0.9s ease-in-out infinite alternate 0.3s; }

        @keyframes eq {
            0% { height: 8px; }
            100% { height: 32px; }
        }

        .nav-tabs .nav-link {
            color: rgba(255, 255, 255, 0.6);
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 24px;
        }
        .nav-tabs .nav-link.active {
            color: var(--neon-blue);
            background: transparent;
            border-bottom: 3px solid var(--neon-blue);
        }

        /* 播放清單與卡片設計 */
        .playlist-container {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-item.active {
            background: rgba(0, 242, 254, 0.15);
            border-left: 4px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
        }

        .mode-btn {
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 14px;
            transition: all 0.2s ease;
        }

        video {
            border-radius: 20px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 650px;">
        <!-- 頂部標題區 -->
        <div class="glass-card p-4 mb-4 text-center">
            <h3 class="fw-bold mb-1" style="background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                <i class="fa-solid fa-compact-disc me-2 text-info"></i>酷炫音樂影音平台
            </h3>
            <p class="small text-white-50 mb-0"><span id="header-song-count">21</span> 首動漫原聲全數匯入 • 支援單曲循環 / 全曲循環 / 隨機播放</p>
        </div>

        <!-- 2 大核心分頁 -->
        <ul class="nav nav-tabs mb-4 justify-content-center border-bottom border-secondary" id="mediaTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="music-tab" data-bs-toggle="tab" data-bs-target="#music-panel" type="button" role="tab">
                    <i class="fa-solid fa-headphones me-2"></i>MP3 音樂大碟 (<span id="mp3-tab-count">21</span>首)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video-panel" type="button" role="tab">
                    <i class="fa-solid fa-film me-2"></i>MP4 高清視訊 (<span id="mp4-tab-count">21</span>首)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mediaTabContent">
            <!-- 1. 高音質 MP3 播放面板 -->
            <div class="tab-pane fade show active" id="music-panel" role="tabpanel">
                <div class="glass-card p-4 text-center mb-4">
                    <div class="cd-wrapper mb-3">
                        <div class="cd-disc" id="cd-disc">
                            <div class="cd-center"></div>
                        </div>
                    </div>

                    <!-- 頻譜波形 -->
                    <div class="equalizer mb-3" id="audio-eq">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>

                    <!-- 播放資訊 -->
                    <h5 class="fw-bold text-white mb-1" id="current-title">載入中...</h5>
                    <p class="small text-white-50 mb-3" id="current-subtitle">索引 #1 / 21 • 128k VBR 高品質音訊</p>

                    <!-- 控制按鈕區 (上一首 / 播放 / 下一首 / 播放模式) -->
                    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="prevSong()" title="上一首" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button class="btn btn-info rounded-circle p-2 text-white shadow" onclick="togglePlay()" id="main-play-btn" title="播放/暫停" style="width: 52px; height: 52px;">
                            <i class="fa-solid fa-play fa-lg" id="main-play-icon"></i>
                        </button>
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="nextSong()" title="下一首" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="btn btn-outline-warning mode-btn" onclick="toggleLoopMode()" id="loop-mode-btn" title="點擊切換循環模式">
                            <i class="fa-solid fa-repeat me-1" id="loop-mode-icon"></i><span id="loop-mode-text">全曲循環</span>
                        </button>
                    </div>

                    <!-- 音樂音量控制列 -->
                    <div class="d-flex align-items-center justify-content-center gap-2 mb-3 px-3 py-2 rounded-pill" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);">
                        <button class="btn btn-sm btn-link text-info p-0 text-decoration-none" id="audio-mute-btn" onclick="toggleAudioMute()" title="靜音 / 取消靜音">
                            <i class="fa-solid fa-volume-high" id="audio-mute-icon"></i>
                        </button>
                        <input type="range" class="form-range flex-grow-1 mx-2" id="audio-volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeAudioVolume(this.value)" style="cursor: pointer; max-width: 260px;">
                        <span class="small fw-bold text-info" id="audio-volume-text" style="min-width: 42px; font-size: 0.82rem;">100%</span>
                    </div>

                    <!-- 原生 HTML5 音訊控制項 -->
                    <audio id="audio-player" class="w-100" controls crossorigin="anonymous" style="filter: invert(0.9) hue-rotate(180deg);">
                        您的瀏覽器不支援 HTML5 音訊播放
                    </audio>
                </div>

                <!-- 播放清單卡片 -->
                <div class="glass-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                        <h6 class="fw-bold mb-0 text-info"><i class="fa-solid fa-list-ul me-2"></i>全部歌單 (點擊即刻播放)</h6>
                        <span class="badge bg-secondary rounded-pill" id="audio-badge-count">共 21 首</span>
                    </div>
                    <div class="playlist-container" id="audio-playlist">
                        <!-- 動態渲染清單項目 -->
                    </div>
                </div>
            </div>

            <!-- 2. 高清 MP4 影片播放面板 -->
            <div class="tab-pane fade" id="video-panel" role="tabpanel">
                <div class="glass-card p-4 text-center mb-4">
                    <h5 class="fw-bold mb-1 text-warning" id="video-current-title">芙莉蓮 • 葬送的芙莉蓮</h5>
                    <p class="small text-white-50 mb-3" id="video-current-subtitle">索引 #1 / 21 • H.264 高畫質視訊</p>

                    <div class="w-100 mb-3">
                        <video id="video-player" class="w-100" controls crossorigin="anonymous" playsinline>
                            您的瀏覽器不支援 HTML5 影片播放
                        </video>
                    </div>

                    <!-- 影片音量控制列 -->
                    <div class="d-flex align-items-center justify-content-center gap-2 mb-3 px-3 py-2 rounded-pill" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);">
                        <button class="btn btn-sm btn-link text-warning p-0 text-decoration-none" id="video-mute-btn" onclick="toggleVideoMute()" title="靜音 / 取消靜音">
                            <i class="fa-solid fa-volume-high" id="video-mute-icon"></i>
                        </button>
                        <input type="range" class="form-range flex-grow-1 mx-2" id="video-volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVideoVolume(this.value)" style="cursor: pointer; max-width: 260px;">
                        <span class="small fw-bold text-warning" id="video-volume-text" style="min-width: 42px; font-size: 0.82rem;">100%</span>
                    </div>

                    <div class="d-flex align-items-center justify-content-center gap-3">
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="prevVideo()" title="上一首影片" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="nextVideo()" title="下一首影片" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="btn btn-outline-warning mode-btn" onclick="toggleVideoLoopMode()" id="video-loop-mode-btn" title="點擊切換影片循環模式">
                            <i class="fa-solid fa-repeat me-1" id="video-loop-mode-icon"></i><span id="video-loop-mode-text">全曲循環</span>
                        </button>
                    </div>
                </div>

                <!-- 影片清單卡片 -->
                <div class="glass-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                        <h6 class="fw-bold mb-0 text-warning"><i class="fa-solid fa-film me-2"></i>影片劇集清單 (點擊播放)</h6>
                        <span class="badge bg-secondary rounded-pill" id="video-badge-count">共 21 支</span>
                    </div>
                    <div class="playlist-container" id="video-playlist">
                        <!-- 動態渲染影片清單項目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function fixUrl(url) {
            if (!url) return '';
            let targetUrl = url;
            if (targetUrl.startsWith('/video/')) {
                targetUrl = 'https://raw.githubusercontent.com/dennis665/fenglan-media-assets/main' + targetUrl;
            }
            return targetUrl.replace(/ /g, "%20");
        }

        const MY_LIFF_ID = "{{ liff_id|default:'2007018318-zM3d88XJ' }}";
        let playlistData = {{ playlist_json|safe|default:"[]" }};

        // 循環模式: 'ALL' (全曲循環), 'ONE' (單曲循環), 'SHUFFLE' (隨機播放)
        let loopMode = 'ALL'; 
        let videoLoopMode = 'ALL';

        let currentIndex = 0;
        let currentVideoIndex = 0;

        let lastAudioVolume = 1.0;
        let lastVideoVolume = 1.0;

        // Web Audio API Gain Node 音量控制器 (解決 iOS / Mobile LINE LIFF 原生音量屬性限制)
        let audioCtx = null;
        let audioGainNode = null;
        let videoGainNode = null;
        let audioSourceNode = null;
        let videoSourceNode = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function setupWebAudioNodes() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const audio = document.getElementById('audio-player');
                const video = document.getElementById('video-player');

                if (audio && !audioSourceNode) {
                    audioSourceNode = ctx.createMediaElementSource(audio);
                    audioGainNode = ctx.createGain();
                    audioSourceNode.connect(audioGainNode);
                    audioGainNode.connect(ctx.destination);
                }

                if (video && !videoSourceNode) {
                    videoSourceNode = ctx.createMediaElementSource(video);
                    videoGainNode = ctx.createGain();
                    videoSourceNode.connect(videoGainNode);
                    videoGainNode.connect(ctx.destination);
                }
            } catch (e) {
                console.warn("WebAudio setup info:", e);
            }
        }

        function initVolumeSettings() {
            const savedAudioVol = localStorage.getItem('cyber_audio_volume');
            const savedVideoVol = localStorage.getItem('cyber_video_volume');

            const audioVol = savedAudioVol !== null ? parseFloat(savedAudioVol) : 1.0;
            const videoVol = savedVideoVol !== null ? parseFloat(savedVideoVol) : 1.0;

            changeAudioVolume(audioVol, false);
            changeVideoVolume(videoVol, false);
        }

        function changeAudioVolume(vol, isUserAction = true) {
            const audio = document.getElementById('audio-player');
            const slider = document.getElementById('audio-volume-slider');
            const text = document.getElementById('audio-volume-text');
            const icon = document.getElementById('audio-mute-icon');

            const volumeVal = Math.max(0, Math.min(1, parseFloat(vol)));

            if (audio) {
                try { audio.volume = volumeVal; } catch(e) {}
            }

            setupWebAudioNodes();
            if (audioGainNode && audioGainNode.gain) {
                audioGainNode.gain.setValueAtTime(volumeVal, audioCtx ? audioCtx.currentTime : 0);
            }

            if (slider) slider.value = volumeVal;

            const pct = Math.round(volumeVal * 100);
            if (text) text.textContent = `${pct}%`;

            if (icon) {
                if (volumeVal === 0) icon.className = 'fa-solid fa-volume-xmark text-danger';
                else if (volumeVal < 0.3) icon.className = 'fa-solid fa-volume-off text-info';
                else if (volumeVal < 0.7) icon.className = 'fa-solid fa-volume-low text-info';
                else icon.className = 'fa-solid fa-volume-high text-info';
            }

            if (volumeVal > 0) lastAudioVolume = volumeVal;
            if (isUserAction) {
                localStorage.setItem('cyber_audio_volume', volumeVal);
            }
        }

        function toggleAudioMute() {
            const audio = document.getElementById('audio-player');
            if (!audio) return;

            const curVol = (audioGainNode && audioGainNode.gain) ? audioGainNode.gain.value : audio.volume;
            if (curVol > 0) {
                lastAudioVolume = curVol;
                changeAudioVolume(0, true);
            } else {
                changeAudioVolume(lastAudioVolume || 0.8, true);
            }
        }

        function changeVideoVolume(vol, isUserAction = true) {
            const video = document.getElementById('video-player');
            const slider = document.getElementById('video-volume-slider');
            const text = document.getElementById('video-volume-text');
            const icon = document.getElementById('video-mute-icon');

            const volumeVal = Math.max(0, Math.min(1, parseFloat(vol)));

            if (video) {
                try { video.volume = volumeVal; } catch(e) {}
            }

            setupWebAudioNodes();
            if (videoGainNode && videoGainNode.gain) {
                videoGainNode.gain.setValueAtTime(volumeVal, audioCtx ? audioCtx.currentTime : 0);
            }

            if (slider) slider.value = volumeVal;

            const pct = Math.round(volumeVal * 100);
            if (text) text.textContent = `${pct}%`;

            if (icon) {
                if (volumeVal === 0) icon.className = 'fa-solid fa-volume-xmark text-danger';
                else if (volumeVal < 0.3) icon.className = 'fa-solid fa-volume-off text-warning';
                else if (volumeVal < 0.7) icon.className = 'fa-solid fa-volume-low text-warning';
                else icon.className = 'fa-solid fa-volume-high text-warning';
            }

            if (volumeVal > 0) lastVideoVolume = volumeVal;
            if (isUserAction) {
                localStorage.setItem('cyber_video_volume', volumeVal);
            }
        }

        function toggleVideoMute() {
            const video = document.getElementById('video-player');
            if (!video) return;

            const curVol = (videoGainNode && videoGainNode.gain) ? videoGainNode.gain.value : video.volume;
            if (curVol > 0) {
                lastVideoVolume = curVol;
                changeVideoVolume(0, true);
            } else {
                changeVideoVolume(lastVideoVolume || 0.8, true);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof liff !== 'undefined' && MY_LIFF_ID) {
                liff.init({ liffId: MY_LIFF_ID }).catch(err => console.error("LIFF Init Error:", err));
            }

            initVolumeSettings();

            
            // 動態從 GitHub video API 取得最新歌單清單
            fetch('https://api.github.com/repos/dennis665/fenglan-media-assets/contents/video')
                .then(res => res.json())
                .then(files => {
                    if (Array.isArray(files) && files.length > 0) {
                        const map = {};
                        files.forEach(f => {
                            const n = f.name || "";
                            if (n.endsWith(".mp3")) {
                                const k = n.slice(0, -4);
                                if (!map[k]) map[k] = { mp3: true, mp4: false };
                                else map[k].mp3 = true;
                            } else if (n.endsWith(".mp4")) {
                                const k = n.slice(0, -4);
                                if (!map[k]) map[k] = { mp3: false, mp4: true };
                                else map[k].mp4 = true;
                            }
                        });
                        const newPlaylist = [];
                        Object.keys(map).forEach(k => {
                            newPlaylist.push({
                                id: k,
                                title: `熱門動漫原聲 ${k}`,
                                mp3: map[k].mp3 ? `/video/${k}.mp3` : (map[k].mp4 ? `/video/${k}.mp4` : null),
                                mp4: map[k].mp4 ? `/video/${k}.mp4` : (map[k].mp3 ? `/video/${k}.mp3` : null)
                            });
                        });
                        if (newPlaylist.length > 0) {
                            playlistData = newPlaylist;
                            renderAudioPlaylist();
                            renderVideoPlaylist();
                        }
                    }
                }).catch(e => console.log("Live GitHub playlist fetch skipped:", e));

            renderAudioPlaylist();
            renderVideoPlaylist();

            loadAudioTrack(0, false);
            loadVideoTrack(0, false);

            const audio = document.getElementById('audio-player');
            const cdDisc = document.getElementById('cd-disc');
            const audioEq = document.getElementById('audio-eq');

            // MP3 播放結束自動接續演算法
            audio.addEventListener('ended', function() {
                if (loopMode === 'ONE') {
                    audio.currentTime = 0;
                    audio.play();
                } else if (loopMode === 'SHUFFLE') {
                    let randomIndex = Math.floor(Math.random() * playlistData.length);
                    loadAudioTrack(randomIndex, true);
                } else {
                    // ALL (全曲循環)
                    let nextIdx = (currentIndex + 1) % playlistData.length;
                    loadAudioTrack(nextIdx, true);
                }
            });

            audio.addEventListener('play', () => {
                cdDisc.classList.add('playing');
                audioEq.classList.add('playing');
                updatePlayBtnIcon(true);
            });

            audio.addEventListener('pause', () => {
                cdDisc.classList.remove('playing');
                audioEq.classList.remove('playing');
                updatePlayBtnIcon(false);
            });

            // MP4 播放結束自動接續演算法
            const video = document.getElementById('video-player');
            video.addEventListener('ended', function() {
                if (videoLoopMode === 'ONE') {
                    video.currentTime = 0;
                    video.play();
                } else if (videoLoopMode === 'SHUFFLE') {
                    let randomIndex = Math.floor(Math.random() * playlistData.length);
                    loadVideoTrack(randomIndex, true);
                } else {
                    let nextIdx = (currentVideoIndex + 1) % playlistData.length;
                    loadVideoTrack(nextIdx, true);
                }
            });
        });

        function updatePlaylistCountUI() {
            const count = playlistData ? playlistData.length : 0;
            const headerCount = document.getElementById('header-song-count');
            const mp3TabCount = document.getElementById('mp3-tab-count');
            const mp4TabCount = document.getElementById('mp4-tab-count');
            const audioBadgeCount = document.getElementById('audio-badge-count');
            const videoBadgeCount = document.getElementById('video-badge-count');

            if (headerCount) headerCount.innerText = count;
            if (mp3TabCount) mp3TabCount.innerText = count;
            if (mp4TabCount) mp4TabCount.innerText = count;
            if (audioBadgeCount) audioBadgeCount.innerText = `共 ${count} 首`;
            if (videoBadgeCount) videoBadgeCount.innerText = `共 ${count} 支`;
        }

        function renderAudioPlaylist() {
            updatePlaylistCountUI();
            const container = document.getElementById('audio-playlist');
            container.innerHTML = '';
            playlistData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => loadAudioTrack(index, true);
                div.innerHTML = `
                    <div>
                        <i class="fa-solid ${index === currentIndex ? 'fa-volume-high text-info' : 'fa-music'} me-2"></i>
                        <span>#${index + 1}. ${item.title}</span>
                    </div>
                    <span class="badge bg-dark border border-secondary text-info">MP3</span>
                `;
                container.appendChild(div);
            });
        }

        function renderVideoPlaylist() {
            updatePlaylistCountUI();
            const container = document.getElementById('video-playlist');
            container.innerHTML = '';
            playlistData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentVideoIndex ? 'active' : ''}`;
                div.onclick = () => loadVideoTrack(index, true);
                div.innerHTML = `
                    <div>
                        <i class="fa-solid ${index === currentVideoIndex ? 'fa-circle-play text-warning' : 'fa-video'} me-2"></i>
                        <span>#${index + 1}. ${item.title}</span>
                    </div>
                    <span class="badge bg-dark border border-secondary text-warning">MP4</span>
                `;
                container.appendChild(div);
            });
        }

        function loadAudioTrack(index, autoPlay = true) {
            if (index < 0 || index >= playlistData.length) return;
            currentIndex = index;
            const item = playlistData[currentIndex];
            const audio = document.getElementById('audio-player');
            audio.src = fixUrl(item.mp3);

            document.getElementById('current-title').innerText = item.title;
            document.getElementById('current-subtitle').innerText = `索引 #${currentIndex + 1} / ${playlistData.length} • 128k VBR 高音質`;

            
            // 動態從 GitHub video API 取得最新歌單清單
            fetch('https://api.github.com/repos/dennis665/fenglan-media-assets/contents/video')
                .then(res => res.json())
                .then(files => {
                    if (Array.isArray(files) && files.length > 0) {
                        const map = {};
                        files.forEach(f => {
                            const n = f.name || "";
                            if (n.endsWith(".mp3")) {
                                const k = n.slice(0, -4);
                                if (!map[k]) map[k] = { mp3: true, mp4: false };
                                else map[k].mp3 = true;
                            } else if (n.endsWith(".mp4")) {
                                const k = n.slice(0, -4);
                                if (!map[k]) map[k] = { mp3: false, mp4: true };
                                else map[k].mp4 = true;
                            }
                        });
                        const newPlaylist = [];
                        Object.keys(map).forEach(k => {
                            newPlaylist.append ? newPlaylist.push({
                                id: k,
                                title: `熱門動漫原聲 ${k}`,
                                mp3: map[k].mp3 ? `/video/${k}.mp3` : (map[k].mp4 ? `/video/${k}.mp4` : null),
                                mp4: map[k].mp4 ? `/video/${k}.mp4` : (map[k].mp3 ? `/video/${k}.mp3` : null)
                            }) : null;
                        });
                        if (newPlaylist.length > 0) {
                            playlistData = newPlaylist;
                            renderAudioPlaylist();
                            renderVideoPlaylist();
                        }
                    }
                }).catch(e => console.log("Live GitHub playlist fetch skipped:", e));

            renderAudioPlaylist();

            if (autoPlay) {
                audio.play().catch(e => console.log('Autoplay prevented:', e));
            }
        }

        function loadVideoTrack(index, autoPlay = true) {
            if (index < 0 || index >= playlistData.length) return;
            currentVideoIndex = index;
            const item = playlistData[currentVideoIndex];
            const video = document.getElementById('video-player');
            video.src = fixUrl(item.mp4);

            document.getElementById('video-current-title').innerText = item.title;
            document.getElementById('video-current-subtitle').innerText = `索引 #${currentVideoIndex + 1} / ${playlistData.length} • H.264 高清視訊`;

            renderVideoPlaylist();

            if (autoPlay) {
                video.play().catch(e => console.log('Video autoplay prevented:', e));
            }
        }

        function togglePlay() {
            const audio = document.getElementById('audio-player');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function updatePlayBtnIcon(isPlaying) {
            const icon = document.getElementById('main-play-icon');
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause fa-lg';
            } else {
                icon.className = 'fa-solid fa-play fa-lg';
            }
        }

        function prevSong() {
            let prevIdx = (currentIndex - 1 + playlistData.length) % playlistData.length;
            loadAudioTrack(prevIdx, true);
        }

        function nextSong() {
            if (loopMode === 'SHUFFLE') {
                let randomIndex = Math.floor(Math.random() * playlistData.length);
                loadAudioTrack(randomIndex, true);
            } else {
                let nextIdx = (currentIndex + 1) % playlistData.length;
                loadAudioTrack(nextIdx, true);
            }
        }

        function prevVideo() {
            let prevIdx = (currentVideoIndex - 1 + playlistData.length) % playlistData.length;
            loadVideoTrack(prevIdx, true);
        }

        function nextVideo() {
            if (videoLoopMode === 'SHUFFLE') {
                let randomIndex = Math.floor(Math.random() * playlistData.length);
                loadVideoTrack(randomIndex, true);
            } else {
                let nextIdx = (currentVideoIndex + 1) % playlistData.length;
                loadVideoTrack(nextIdx, true);
            }
        }

        // 切換 MP3 循環模式: ALL (全曲循環) -> ONE (單曲循環) -> SHUFFLE (隨機播放)
        function toggleLoopMode() {
            const btnText = document.getElementById('loop-mode-text');
            const btnIcon = document.getElementById('loop-mode-icon');
            const btn = document.getElementById('loop-mode-btn');

            if (loopMode === 'ALL') {
                loopMode = 'ONE';
                btnText.innerText = '單曲循環';
                btnIcon.className = 'fa-solid fa-rotate-right me-1';
                btn.className = 'btn btn-outline-info mode-btn';
            } else if (loopMode === 'ONE') {
                loopMode = 'SHUFFLE';
                btnText.innerText = '隨機播放';
                btnIcon.className = 'fa-solid fa-shuffle me-1';
                btn.className = 'btn btn-outline-success mode-btn';
            } else {
                loopMode = 'ALL';
                btnText.innerText = '全曲循環';
                btnIcon.className = 'fa-solid fa-repeat me-1';
                btn.className = 'btn btn-outline-warning mode-btn';
            }
        }

        // 切換 MP4 影片循環模式: ALL -> ONE -> SHUFFLE
        function toggleVideoLoopMode() {
            const btnText = document.getElementById('video-loop-mode-text');
            const btnIcon = document.getElementById('video-loop-mode-icon');
            const btn = document.getElementById('video-loop-mode-btn');

            if (videoLoopMode === 'ALL') {
                videoLoopMode = 'ONE';
                btnText.innerText = '單曲循環';
                btnIcon.className = 'fa-solid fa-rotate-right me-1';
                btn.className = 'btn btn-outline-info mode-btn';
            } else if (videoLoopMode === 'ONE') {
                videoLoopMode = 'SHUFFLE';
                btnText.innerText = '隨機播放';
                btnIcon.className = 'fa-solid fa-shuffle me-1';
                btn.className = 'btn btn-outline-success mode-btn';
            } else {
                videoLoopMode = 'ALL';
                btnText.innerText = '全曲循環';
                btnIcon.className = 'fa-solid fa-repeat me-1';
                btn.className = 'btn btn-outline-warning mode-btn';
            }
        }
    </script>
</body>
</html>
