<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI Cyber Studio - 酷炫音樂影音平台</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(18, 22, 31, 0.85);
            --neon-blue: #00f2fe;
            --neon-purple: #9b51e0;
            --neon-pink: #ff0844;
            --gold-accent: #ffd700;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(155, 81, 224, 0.18) 0%, transparent 45%);
            color: #fff;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: 50px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        /* 3D 黑金 CD 旋轉唱片 */
        .cd-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #111, #222);
            padding: 8px;
            box-shadow: 0 0 30px rgba(155, 81, 224, 0.5), inset 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .cd-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, #1a1a1a, #1a1a1a 3px, #0d0d0d 6px, #0d0d0d 9px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .cd-disc.playing {
            animation-play-state: running;
        }
        .cd-center {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: 4px solid #111;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 音樂頻譜波形 bar */
        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 32px;
            margin-top: 15px;
        }
        .eq-bar {
            width: 6px;
            background: linear-gradient(to top, var(--neon-blue), var(--neon-purple));
            border-radius: 4px;
            height: 8px;
            transition: height 0.15s ease;
        }
        .playing .eq-bar:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
        .playing .eq-bar:nth-child(2) { animation: eq 0.6s ease-in-out infinite alternate 0.2s; }
        .playing .eq-bar:nth-child(3) { animation: eq 1.1s ease-in-out infinite alternate 0.4s; }
        .playing .eq-bar:nth-child(4) { animation: eq 0.7s ease-in-out infinite alternate 0.1s; }
        .playing .eq-bar:nth-child(5) { animation: eq 0.9s ease-in-out infinite alternate 0.3s; }

        @keyframes eq {
            0% { height: 8px; }
            100% { height: 32px; }
        }

        .nav-tabs .nav-link {
            color: rgba(255, 255, 255, 0.6);
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 24px;
        }
        .nav-tabs .nav-link.active {
            color: var(--neon-blue);
            background: transparent;
            border-bottom: 3px solid var(--neon-blue);
        }

        /* 播放清單與卡片設計 */
        .playlist-container {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-item.active {
            background: rgba(0, 242, 254, 0.15);
            border-left: 4px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
        }

        .mode-btn {
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 14px;
            transition: all 0.2s ease;
        }

        video {
            border-radius: 20px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 650px;">
        <!-- 頂部標題區 -->
        <div class="glass-card p-4 mb-4 text-center">
            <h3 class="fw-bold mb-1" style="background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                <i class="fa-solid fa-compact-disc me-2 text-info"></i>CSI 酷炫音樂影音平台
            </h3>
            <p class="small text-white-50 mb-0">21 首動漫原聲全數匯入 • 支援單曲循環 / 全曲循環 / 隨機播放</p>
        </div>

        <!-- 2 大核心分頁 -->
        <ul class="nav nav-tabs mb-4 justify-content-center border-bottom border-secondary" id="mediaTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="music-tab" data-bs-toggle="tab" data-bs-target="#music-panel" type="button" role="tab">
                    <i class="fa-solid fa-headphones me-2"></i>MP3 音樂大碟 (21首)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video-panel" type="button" role="tab">
                    <i class="fa-solid fa-film me-2"></i>MP4 高清視訊 (21首)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mediaTabContent">
            <!-- 1. 高音質 MP3 播放面板 -->
            <div class="tab-pane fade show active" id="music-panel" role="tabpanel">
                <div class="glass-card p-4 text-center mb-4">
                    <div class="cd-wrapper mb-3">
                        <div class="cd-disc" id="cd-disc">
                            <div class="cd-center"></div>
                        </div>
                    </div>

                    <!-- 頻譜波形 -->
                    <div class="equalizer mb-3" id="audio-eq">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>

                    <!-- 播放資訊 -->
                    <h5 class="fw-bold text-white mb-1" id="current-title">載入中...</h5>
                    <p class="small text-white-50 mb-3" id="current-subtitle">索引 #1 / 21 • 128k VBR 高品質音訊</p>

                    <!-- 控制按鈕區 (上一首 / 播放 / 下一首 / 播放模式) -->
                    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="prevSong()" title="上一首" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button class="btn btn-info rounded-circle p-2 text-white shadow" onclick="togglePlay()" id="main-play-btn" title="播放/暫停" style="width: 52px; height: 52px;">
                            <i class="fa-solid fa-play fa-lg" id="main-play-icon"></i>
                        </button>
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="nextSong()" title="下一首" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="btn btn-outline-warning mode-btn" onclick="toggleLoopMode()" id="loop-mode-btn" title="點擊切換循環模式">
                            <i class="fa-solid fa-repeat me-1" id="loop-mode-icon"></i><span id="loop-mode-text">全曲循環</span>
                        </button>
                    </div>

                    <!-- 原生 HTML5 音訊控制項 -->
                    <audio id="audio-player" class="w-100" controls style="filter: invert(0.9) hue-rotate(180deg);">
                        您的瀏覽器不支援 HTML5 音訊播放
                    </audio>
                </div>

                <!-- 播放清單卡片 -->
                <div class="glass-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                        <h6 class="fw-bold mb-0 text-info"><i class="fa-solid fa-list-ul me-2"></i>全部歌單 (點擊即刻播放)</h6>
                        <span class="badge bg-secondary rounded-pill">共 21 首</span>
                    </div>
                    <div class="playlist-container" id="audio-playlist">
                        <!-- 動態渲染清單項目 -->
                    </div>
                </div>
            </div>

            <!-- 2. 高清 MP4 影片播放面板 -->
            <div class="tab-pane fade" id="video-panel" role="tabpanel">
                <div class="glass-card p-4 text-center mb-4">
                    <h5 class="fw-bold mb-1 text-warning" id="video-current-title">芙莉蓮 • 葬送的芙莉蓮</h5>
                    <p class="small text-white-50 mb-3" id="video-current-subtitle">索引 #1 / 21 • H.264 高畫質視訊</p>

                    <div class="w-100 mb-3">
                        <video id="video-player" class="w-100" controls playsinline>
                            您的瀏覽器不支援 HTML5 影片播放
                        </video>
                    </div>

                    <div class="d-flex align-items-center justify-content-center gap-3">
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="prevVideo()" title="上一首影片" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button class="btn btn-outline-light rounded-circle p-2" onclick="nextVideo()" title="下一首影片" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="btn btn-outline-warning mode-btn" onclick="toggleVideoLoopMode()" id="video-loop-mode-btn" title="點擊切換影片循環模式">
                            <i class="fa-solid fa-repeat me-1" id="video-loop-mode-icon"></i><span id="video-loop-mode-text">全曲循環</span>
                        </button>
                    </div>
                </div>

                <!-- 影片清單卡片 -->
                <div class="glass-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                        <h6 class="fw-bold mb-0 text-warning"><i class="fa-solid fa-film me-2"></i>影片劇集清單 (點擊播放)</h6>
                        <span class="badge bg-secondary rounded-pill">共 21 支</span>
                    </div>
                    <div class="playlist-container" id="video-playlist">
                        <!-- 動態渲染影片清單項目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const MY_LIFF_ID = "{{ liff_id|default:'2007018318-zM3d88XJ' }}";
        const playlistData = [{"id": "不才惡女", "title": "熱門動漫原聲 不才惡女", "mp3": "/static/video/不才惡女.mp3", "mp4": "/static/video/不才惡女.mp4"}, {"id": "世界最強後衛", "title": "熱門動漫原聲 世界最強後衛", "mp3": "/static/video/世界最強後衛.mp3", "mp4": "/static/video/世界最強後衛.mp4"}, {"id": "向日葵馬戲團", "title": "熱門動漫原聲 向日葵馬戲團", "mp3": "/static/video/向日葵馬戲團.mp3", "mp4": "/static/video/向日葵馬戲團.mp4"}, {"id": "大小姐才不玩格鬥遊戲", "title": "熱門動漫原聲 大小姐才不玩格鬥遊戲", "mp3": "/static/video/大小姐才不玩格鬥遊戲.mp3", "mp4": "/static/video/大小姐才不玩格鬥遊戲.mp4"}, {"id": "奇招百出的維多利亞", "title": "熱門動漫原聲 奇招百出的維多利亞", "mp3": "/static/video/奇招百出的維多利亞.mp3", "mp4": "/static/video/奇招百出的維多利亞.mp4"}, {"id": "奈葉 EXCEEDS", "title": "熱門動漫原聲 奈葉 EXCEEDS", "mp3": "/static/video/奈葉 EXCEEDS.mp3", "mp4": "/static/video/奈葉 EXCEEDS.mp4"}, {"id": "奔馳於透明之夜", "title": "熱門動漫原聲 奔馳於透明之夜", "mp3": "/static/video/奔馳於透明之夜.mp3", "mp4": "/static/video/奔馳於透明之夜.mp4"}, {"id": "女性向遊戲世界第二季", "title": "熱門動漫原聲 女性向遊戲世界第二季", "mp3": "/static/video/女性向遊戲世界第二季.mp3", "mp4": "/static/video/女性向遊戲世界第二季.mp4"}, {"id": "小書痴第二季", "title": "熱門動漫原聲 小書痴第二季", "mp3": "/static/video/小書痴第二季.mp3", "mp4": "/static/video/小書痴第二季.mp4"}, {"id": "尼古喵喵", "title": "熱門動漫原聲 尼古喵喵", "mp3": "/static/video/尼古喵喵.mp3", "mp4": "/static/video/尼古喵喵.mp4"}, {"id": "幼女戰記第二季", "title": "熱門動漫原聲 幼女戰記第二季", "mp3": "/static/video/幼女戰記第二季.mp3", "mp4": "/static/video/幼女戰記第二季.mp4"}, {"id": "擅長逃跑的殿下第二季", "title": "熱門動漫原聲 擅長逃跑的殿下第二季", "mp3": "/static/video/擅長逃跑的殿下第二季.mp3", "mp4": "/static/video/擅長逃跑的殿下第二季.mp4"}, {"id": "無用聖女的異世界美食之旅", "title": "熱門動漫原聲 無用聖女的異世界美食之旅", "mp3": "/static/video/無用聖女的異世界美食之旅.mp3", "mp4": "/static/video/無用聖女的異世界美食之旅.mp4"}, {"id": "相反的你和我第二季", "title": "熱門動漫原聲 相反的你和我第二季", "mp3": "/static/video/相反的你和我第二季.mp3", "mp4": "/static/video/相反的你和我第二季.mp4"}, {"id": "相戀到生命盡頭", "title": "熱門動漫原聲 相戀到生命盡頭", "mp3": "/static/video/相戀到生命盡頭.mp3", "mp4": "/static/video/相戀到生命盡頭.mp4"}, {"id": "碧藍之海第三季", "title": "熱門動漫原聲 碧藍之海第三季", "mp3": "/static/video/碧藍之海第三季.mp3", "mp4": "/static/video/碧藍之海第三季.mp4"}, {"id": "超市後門抽菸的兩人", "title": "熱門動漫原聲 超市後門抽菸的兩人", "mp3": "/static/video/超市後門抽菸的兩人.mp3", "mp4": "/static/video/超市後門抽菸的兩人.mp4"}, {"id": "轉生成史萊姆第四季2", "title": "熱門動漫原聲 轉生成史萊姆第四季2", "mp3": "/static/video/轉生成史萊姆第四季2.mp3", "mp4": "/static/video/轉生成史萊姆第四季2.mp4"}, {"id": "重騎士", "title": "熱門動漫原聲 重騎士", "mp3": "/static/video/重騎士.mp3", "mp4": "/static/video/重騎士.mp4"}, {"id": "骸骨騎士第二季", "title": "熱門動漫原聲 骸骨騎士第二季", "mp3": "/static/video/骸骨騎士第二季.mp3", "mp4": "/static/video/骸骨騎士第二季.mp4"}, {"id": "魔獸之王第二季", "title": "熱門動漫原聲 魔獸之王第二季", "mp3": "/static/video/魔獸之王第二季.mp3", "mp4": "/static/video/魔獸之王第二季.mp4"}];

        // 循環模式: 'ALL' (全曲循環), 'ONE' (單曲循環), 'SHUFFLE' (隨機播放)
        let loopMode = 'ALL'; 
        let videoLoopMode = 'ALL';

        let currentIndex = 0;
        let currentVideoIndex = 0;

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof liff !== 'undefined' && MY_LIFF_ID) {
                liff.init({ liffId: MY_LIFF_ID }).catch(err => console.error("LIFF Init Error:", err));
            }

            renderAudioPlaylist();
            renderVideoPlaylist();

            loadAudioTrack(0, false);
            loadVideoTrack(0, false);

            const audio = document.getElementById('audio-player');
            const cdDisc = document.getElementById('cd-disc');
            const audioEq = document.getElementById('audio-eq');

            // MP3 播放結束自動接續演算法
            audio.addEventListener('ended', function() {
                if (loopMode === 'ONE') {
                    audio.currentTime = 0;
                    audio.play();
                } else if (loopMode === 'SHUFFLE') {
                    let randomIndex = Math.floor(Math.random() * playlistData.length);
                    loadAudioTrack(randomIndex, true);
                } else {
                    // ALL (全曲循環)
                    let nextIdx = (currentIndex + 1) % playlistData.length;
                    loadAudioTrack(nextIdx, true);
                }
            });

            audio.addEventListener('play', () => {
                cdDisc.classList.add('playing');
                audioEq.classList.add('playing');
                updatePlayBtnIcon(true);
            });

            audio.addEventListener('pause', () => {
                cdDisc.classList.remove('playing');
                audioEq.classList.remove('playing');
                updatePlayBtnIcon(false);
            });

            // MP4 播放結束自動接續演算法
            const video = document.getElementById('video-player');
            video.addEventListener('ended', function() {
                if (videoLoopMode === 'ONE') {
                    video.currentTime = 0;
                    video.play();
                } else if (videoLoopMode === 'SHUFFLE') {
                    let randomIndex = Math.floor(Math.random() * playlistData.length);
                    loadVideoTrack(randomIndex, true);
                } else {
                    let nextIdx = (currentVideoIndex + 1) % playlistData.length;
                    loadVideoTrack(nextIdx, true);
                }
            });
        });

        function renderAudioPlaylist() {
            const container = document.getElementById('audio-playlist');
            container.innerHTML = '';
            playlistData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => loadAudioTrack(index, true);
                div.innerHTML = `
                    <div>
                        <i class="fa-solid ${index === currentIndex ? 'fa-volume-high text-info' : 'fa-music'} me-2"></i>
                        <span>#${index + 1}. ${item.title}</span>
                    </div>
                    <span class="badge bg-dark border border-secondary text-info">MP3</span>
                `;
                container.appendChild(div);
            });
        }

        function renderVideoPlaylist() {
            const container = document.getElementById('video-playlist');
            container.innerHTML = '';
            playlistData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentVideoIndex ? 'active' : ''}`;
                div.onclick = () => loadVideoTrack(index, true);
                div.innerHTML = `
                    <div>
                        <i class="fa-solid ${index === currentVideoIndex ? 'fa-circle-play text-warning' : 'fa-video'} me-2"></i>
                        <span>#${index + 1}. ${item.title}</span>
                    </div>
                    <span class="badge bg-dark border border-secondary text-warning">MP4</span>
                `;
                container.appendChild(div);
            });
        }

        function loadAudioTrack(index, autoPlay = true) {
            if (index < 0 || index >= playlistData.length) return;
            currentIndex = index;
            const item = playlistData[currentIndex];
            const audio = document.getElementById('audio-player');
            audio.src = item.mp3;

            document.getElementById('current-title').innerText = item.title;
            document.getElementById('current-subtitle').innerText = `索引 #${currentIndex + 1} / ${playlistData.length} • 128k VBR 高音質`;

            renderAudioPlaylist();

            if (autoPlay) {
                audio.play().catch(e => console.log('Autoplay prevented:', e));
            }
        }

        function loadVideoTrack(index, autoPlay = true) {
            if (index < 0 || index >= playlistData.length) return;
            currentVideoIndex = index;
            const item = playlistData[currentVideoIndex];
            const video = document.getElementById('video-player');
            video.src = item.mp4;

            document.getElementById('video-current-title').innerText = item.title;
            document.getElementById('video-current-subtitle').innerText = `索引 #${currentVideoIndex + 1} / ${playlistData.length} • H.264 高清視訊`;

            renderVideoPlaylist();

            if (autoPlay) {
                video.play().catch(e => console.log('Video autoplay prevented:', e));
            }
        }

        function togglePlay() {
            const audio = document.getElementById('audio-player');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function updatePlayBtnIcon(isPlaying) {
            const icon = document.getElementById('main-play-icon');
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause fa-lg';
            } else {
                icon.className = 'fa-solid fa-play fa-lg';
            }
        }

        function prevSong() {
            let prevIdx = (currentIndex - 1 + playlistData.length) % playlistData.length;
            loadAudioTrack(prevIdx, true);
        }

        function nextSong() {
            if (loopMode === 'SHUFFLE') {
                let randomIndex = Math.floor(Math.random() * playlistData.length);
                loadAudioTrack(randomIndex, true);
            } else {
                let nextIdx = (currentIndex + 1) % playlistData.length;
                loadAudioTrack(nextIdx, true);
            }
        }

        function prevVideo() {
            let prevIdx = (currentVideoIndex - 1 + playlistData.length) % playlistData.length;
            loadVideoTrack(prevIdx, true);
        }

        function nextVideo() {
            if (videoLoopMode === 'SHUFFLE') {
                let randomIndex = Math.floor(Math.random() * playlistData.length);
                loadVideoTrack(randomIndex, true);
            } else {
                let nextIdx = (currentVideoIndex + 1) % playlistData.length;
                loadVideoTrack(nextIdx, true);
            }
        }

        // 切換 MP3 循環模式: ALL (全曲循環) -> ONE (單曲循環) -> SHUFFLE (隨機播放)
        function toggleLoopMode() {
            const btnText = document.getElementById('loop-mode-text');
            const btnIcon = document.getElementById('loop-mode-icon');
            const btn = document.getElementById('loop-mode-btn');

            if (loopMode === 'ALL') {
                loopMode = 'ONE';
                btnText.innerText = '單曲循環';
                btnIcon.className = 'fa-solid fa-rotate-right me-1';
                btn.className = 'btn btn-outline-info mode-btn';
            } else if (loopMode === 'ONE') {
                loopMode = 'SHUFFLE';
                btnText.innerText = '隨機播放';
                btnIcon.className = 'fa-solid fa-shuffle me-1';
                btn.className = 'btn btn-outline-success mode-btn';
            } else {
                loopMode = 'ALL';
                btnText.innerText = '全曲循環';
                btnIcon.className = 'fa-solid fa-repeat me-1';
                btn.className = 'btn btn-outline-warning mode-btn';
            }
        }

        // 切換 MP4 影片循環模式: ALL -> ONE -> SHUFFLE
        function toggleVideoLoopMode() {
            const btnText = document.getElementById('video-loop-mode-text');
            const btnIcon = document.getElementById('video-loop-mode-icon');
            const btn = document.getElementById('video-loop-mode-btn');

            if (videoLoopMode === 'ALL') {
                videoLoopMode = 'ONE';
                btnText.innerText = '單曲循環';
                btnIcon.className = 'fa-solid fa-rotate-right me-1';
                btn.className = 'btn btn-outline-info mode-btn';
            } else if (videoLoopMode === 'ONE') {
                videoLoopMode = 'SHUFFLE';
                btnText.innerText = '隨機播放';
                btnIcon.className = 'fa-solid fa-shuffle me-1';
                btn.className = 'btn btn-outline-success mode-btn';
            } else {
                videoLoopMode = 'ALL';
                btnText.innerText = '全曲循環';
                btnIcon.className = 'fa-solid fa-repeat me-1';
                btn.className = 'btn btn-outline-warning mode-btn';
            }
        }
    </script>
</body>
</html>
