<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的追劇小幫手</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #0f172a 100%);
            min-height: 100vh;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            color: #f8fafc;
        }
        .text-dark {
            color: #f8fafc !important;
        }
        .text-muted {
            color: #94a3b8 !important;
        }
        .text-secondary {
            color: #cbd5e1 !important;
        }
        .bg-white {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }
        .bg-light {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: #cbd5e1 !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
        }
        .border {
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            color: #f8fafc !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(15, 23, 42, 0.95) !important;
            color: #ffffff !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important;
        }
        .form-select option, .form-select optgroup {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        .btn-line {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }
        .btn-line:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            font-weight: bold;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-outline-primary {
            color: #38bdf8 !important;
            border-color: rgba(56, 189, 248, 0.5) !important;
        }
        .btn-outline-primary:hover {
            background-color: rgba(56, 189, 248, 0.15) !important;
            border-color: #38bdf8 !important;
            color: #7dd3fc !important;
        }
        .btn-outline-danger {
            color: #fb7185 !important;
            border-color: rgba(251, 113, 133, 0.5) !important;
        }
        .btn-outline-danger:hover {
            background-color: rgba(251, 113, 133, 0.15) !important;
            border-color: #fb7185 !important;
            color: #fda4af !important;
        }
        .btn-outline-secondary {
            color: #cbd5e1 !important;
            border-color: rgba(203, 213, 225, 0.3) !important;
        }
        .btn-outline-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
        }
        .modal-content {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        .card {
            background-color: rgba(30, 41, 59, 0.8) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }
        .list-group-item {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .list-group-item-action:hover {
            background-color: #334155 !important;
            color: #38bdf8 !important;
        }
        .drama-item {
            border-left: 5px solid #38bdf8;
            transition: transform 0.2s ease;
        }
        .drama-item:hover {
            transform: scale(1.02);
        }
        /* 強效 NEW 脈衝提醒徽章 (相容 iOS Safari / LINE WebView) */
        .badge-new-pulse,
        .btn .badge-new-pulse,
        .btn-outline-primary .badge-new-pulse,
        .btn-outline-danger .badge-new-pulse {
            background: #ff3b30 !important;
            background-color: #ff3b30 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-weight: 900 !important;
            font-size: 0.65rem !important;
            padding: 0.25em 0.55em !important;
            border-radius: 50rem !important;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.7) !important;
            display: inline-block !important;
            line-height: 1 !important;
            vertical-align: middle !important;
            letter-spacing: 0.5px !important;
            opacity: 1 !important;
        }
        .loader {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 500px;">
        <!-- 載入中畫面 -->
        <div id="loading-section" class="text-center py-5">
            <div class="loader d-inline-block"></div>
            <p class="mt-3 text-muted fw-bold">正在讀取 LINE 追劇檔案...</p>
        </div>

        <!-- 主要畫面 -->
        <div id="main-section" class="d-none">
            <!-- 頂部 Header -->
            <div class="glass-card p-3 mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-0 text-success" id="group-title" style="font-size: 1.35rem;">
                        <i class="fa-solid fa-clapperboard me-2"></i>追劇清單
                    </h3>
                    <span class="text-muted small">Hi, <span id="user-display-name" class="fw-bold text-success">LINE 用戶</span></span>
                </div>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="openDisplaySettingsModal()">
                        <i class="fa-solid fa-sliders me-1"></i>顯示設定
                    </button>
                    <button class="btn btn-sm btn-line px-3" onclick="openAddDramaModal()">
                        <i class="fa-solid fa-plus me-1"></i>新增劇集
                    </button>
                </div>
            </div>

            <!-- 分頁 Tab -->
            <ul class="nav nav-tabs justify-content-center mb-3" id="dramaTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="my-dramas-tab" data-bs-toggle="tab" data-bs-target="#my-dramas-panel" type="button" role="tab" onclick="switchTab('my_dramas')">📺 我的追劇</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="all-dramas-tab" data-bs-toggle="tab" data-bs-target="#all-dramas-panel" type="button" role="tab" onclick="switchTab('all_dramas')">🌐 探索新番/劇庫</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="recs-tab" data-bs-toggle="tab" data-bs-target="#recs-panel" type="button" role="tab" onclick="switchTab('recommendations')">📬 好友推薦</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="friends-tab" data-bs-toggle="tab" data-bs-target="#friends-panel" type="button" role="tab" onclick="switchTab('friends')">👥 好友管理</button>
                </li>
            </ul>

            <!-- 可折疊分類導航視覺面板 (季番與動畫電影大類可折疊/展開，細項預設顯示前5項且可展開/折疊) -->
            <div class="glass-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2 cursor-pointer" onclick="toggleMainCategorySection()">
                    <h6 class="fw-bold text-success mb-0">
                        <i class="fa-solid fa-layer-group me-1"></i>快捷年度分類導航
                    </h6>
                    <span class="badge bg-light text-secondary border small" id="main-cat-toggle-icon">
                        <i class="fa-solid fa-chevron-up me-1"></i>折疊面板
                    </span>
                </div>
                <div id="main-cat-container">
                    <!-- 季番動畫區塊 (可折疊) -->
                    <div class="border rounded p-2 mb-2 bg-white">
                        <div class="d-flex justify-content-between align-items-center mb-1 cursor-pointer" onclick="toggleCategorySubItems('tv', true)">
                            <span class="fw-bold small text-primary">
                                <i class="fa-solid fa-tv me-1"></i>📺 季番動畫 (依年度由新至舊)
                            </span>
                            <button class="btn btn-sm btn-link text-decoration-none text-muted p-0 small" id="toggle-tv-btn" style="font-size: 0.75rem;">
                                <i class="fa-solid fa-angle-down me-1"></i><span id="tv-toggle-label">展開更多細項</span>
                            </button>
                        </div>
                        <div id="tv-cat-chips" class="d-flex flex-wrap gap-1"></div>
                    </div>
                    <!-- 動畫電影區塊 (可折疊) -->
                    <div class="border rounded p-2 bg-white">
                        <div class="d-flex justify-content-between align-items-center mb-1 cursor-pointer" onclick="toggleCategorySubItems('movie', true)">
                            <span class="fw-bold small text-danger">
                                <i class="fa-solid fa-film me-1"></i>🎬 動畫電影 / 劇場版 (依年度由新至舊)
                            </span>
                            <button class="btn btn-sm btn-link text-decoration-none text-muted p-0 small" id="toggle-movie-btn" style="font-size: 0.75rem;">
                                <i class="fa-solid fa-angle-down me-1"></i><span id="movie-toggle-label">展開更多細項</span>
                            </button>
                        </div>
                        <div id="movie-cat-chips" class="d-flex flex-wrap gap-1"></div>
                    </div>
                </div>
            </div>

            <!-- 分頁內容 -->
            <div class="tab-content">
                <!-- 我的追劇 -->
                <div class="tab-pane fade show active" id="my-dramas-panel" role="tabpanel">
                    <!-- 搜尋與分類選單 -->
                    <div class="glass-card p-3 mb-3 d-flex gap-2 align-items-center flex-wrap">
                        <div class="flex-grow-1 position-relative" style="min-width: 150px;">
                            <i class="fa-solid fa-magnifying-glass text-secondary position-absolute" style="left: 12px; top: 10px;"></i>
                            <input type="text" id="my-dramas-search" class="form-control form-control-sm rounded-pill ps-4" placeholder="搜尋我的劇集..." oninput="triggerMyDramasSearch()">
                        </div>
                        <select id="my-dramas-cat-select" class="form-select form-select-sm rounded-pill w-auto" onchange="triggerMyDramasSearch()">
                            <option value="">所有分類</option>
                        </select>
                    </div>
                    <div id="my-dramas-list" class="d-flex flex-column gap-3"></div>
                    
                    <!-- 底部分頁列：筆數選擇 + 上/下一頁 + 總頁數顯示 + 指定頁數跳轉 -->
                    <div id="my-pagination" class="glass-card p-3 mt-3 d-none flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">每頁:</span>
                                <select id="my-page-size-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="changePageSize(this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10" selected>10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                            <div class="small text-muted fw-bold">
                                第 <span id="my-page-num" class="text-success fw-bold">1</span> / 共 <span id="my-total-pages" class="text-dark fw-bold">1</span> 頁 (<span id="my-total-count" class="text-primary">0</span>筆)
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-2 pt-1 border-top">
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="my-prev-btn" onclick="changePage(-1)">上一頁</button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">跳至:</span>
                                <select id="my-jump-page-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="jumpToPage(this.value)">
                                    <!-- 動態填入頁碼 -->
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="my-next-btn" onclick="changePage(1)">下一頁</button>
                        </div>
                    </div>
                </div>

                <!-- 探索新番/劇庫 -->
                <div class="tab-pane fade" id="all-dramas-panel" role="tabpanel">
                    <!-- 搜尋與分類選單 -->
                    <div class="glass-card p-3 mb-3 d-flex gap-2 align-items-center flex-wrap">
                        <div class="flex-grow-1 position-relative" style="min-width: 150px;">
                            <i class="fa-solid fa-magnifying-glass text-secondary position-absolute" style="left: 12px; top: 10px;"></i>
                            <input type="text" id="all-dramas-search" class="form-control form-control-sm rounded-pill ps-4" placeholder="搜尋劇名或新番..." oninput="triggerAllDramasSearch()">
                        </div>
                        <select id="all-dramas-cat-select" class="form-select form-select-sm rounded-pill w-auto" onchange="triggerAllDramasSearch()">
                            <option value="">所有分類</option>
                        </select>
                    </div>
                    <div id="all-dramas-list" class="d-flex flex-column gap-3"></div>
                    
                    <!-- 底部分頁列：筆數選擇 + 上/下一頁 + 總頁數顯示 + 指定頁數跳轉 -->
                    <div id="all-pagination" class="glass-card p-3 mt-3 d-none flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">每頁:</span>
                                <select id="all-page-size-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="changePageSize(this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10" selected>10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                            <div class="small text-muted fw-bold">
                                第 <span id="all-page-num" class="text-success fw-bold">1</span> / 共 <span id="all-total-pages" class="text-dark fw-bold">1</span> 頁 (<span id="all-total-count" class="text-primary">0</span>筆)
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-2 pt-1 border-top">
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="all-prev-btn" onclick="changePage(-1)">上一頁</button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">跳至:</span>
                                <select id="all-jump-page-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="jumpToPage(this.value)">
                                    <!-- 動態填入頁碼 -->
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="all-next-btn" onclick="changePage(1)">下一頁</button>
                        </div>
                    </div>
                </div>

                <!-- 好友推薦 -->
                <div class="tab-pane fade" id="recs-panel" role="tabpanel">
                    <div id="recs-list" class="d-flex flex-column gap-3"></div>
                    <div id="recs-pagination" class="glass-card p-3 mt-3 d-none flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">每頁:</span>
                                <select id="recs-page-size-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="changePageSize(this.value)">
                                    <option value="5">5 筆</option>
                                    <option value="10" selected>10 筆</option>
                                    <option value="20">20 筆</option>
                                </select>
                            </div>
                            <div class="small text-muted fw-bold">
                                第 <span id="recs-page-num" class="text-success fw-bold">1</span> / 共 <span id="recs-total-pages" class="text-dark fw-bold">1</span> 頁 (<span id="recs-total-count" class="text-primary">0</span>筆)
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-2 pt-1 border-top">
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="recs-prev-btn" onclick="changePage(-1)">上一頁</button>
                            <div class="d-flex align-items-center gap-1">
                                <span class="small text-muted text-nowrap">跳至:</span>
                                <select id="recs-jump-page-select" class="form-select form-select-sm rounded-pill py-0 ps-2 pe-4" style="width: auto; font-size: 0.8rem;" onchange="jumpToPage(this.value)">
                                    <!-- 動態填入頁碼 -->
                                </select>
                            </div>
                            <button class="btn btn-sm btn-outline-success px-3 rounded-pill" id="recs-next-btn" onclick="changePage(1)">下一頁</button>
                        </div>
                    </div>
                </div>

                <!-- 好友管理 -->
                <div class="tab-pane fade" id="friends-panel" role="tabpanel">
                    <!-- 新增好友 -->
                    <div class="glass-card p-3 mb-3">
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-user-plus text-success me-1"></i>搜尋並新增 LINE 好友</h6>
                        <div class="mb-2">
                            <input type="text" id="friend-search-input" class="form-control form-control-sm" placeholder="輸入 LINE 暱稱關鍵字自動搜尋..." oninput="handleFriendSearch()">
                        </div>
                        <div id="search-results-list" class="d-flex flex-column gap-2 mt-2" style="max-height: 150px; overflow-y: auto;">
                            <!-- 搜尋結果將動態插入在此 -->
                        </div>
                    </div>
                    <!-- 好友清單 -->
                    <div class="glass-card p-3">
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-users text-primary me-1"></i>我的追劇好友</h6>
                        <div id="friends-list" class="d-flex flex-column gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 顯示設定 Modal -->
    <div class="modal fade" id="displaySettingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-success"><i class="fa-solid fa-sliders me-1"></i>自訂顯示項目</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">勾選決定是否在劇集卡片上顯示對應的項目：</p>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="pref-category-chk">
                        <label class="form-check-label fw-bold small" for="pref-category-chk">顯示分類 (劇集種類)</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="pref-links-chk">
                        <label class="form-check-label fw-bold small" for="pref-links-chk">顯示相關活動連結</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="pref-total-chk">
                        <label class="form-check-label fw-bold small" for="pref-total-chk">顯示總季數與總集數</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="pref-creator-chk">
                        <label class="form-check-label fw-bold small" for="pref-creator-chk">顯示發起人與更新時間</label>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-line w-100 py-2" onclick="saveDisplaySettings()">儲存設定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/編輯劇集 Modal -->
    <div class="modal fade" id="dramaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-success" id="dramaModalTitle">新增劇集項目</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                    <input type="hidden" id="edit-drama-id">
                    <div class="mb-2 position-relative">
                        <label class="form-label fw-bold small">劇名</label>
                        <input type="text" id="drama-title" class="form-control" placeholder="請輸入劇名" autocomplete="off">
                        <div id="drama-suggestions" class="list-group position-absolute w-100 shadow d-none" style="z-index: 1050; max-height: 200px; overflow-y: auto; background: white; border-radius: 0 0 8px 8px; border: 1px solid #ddd;"></div>
                    </div>
                    <div class="mb-2">

                            <option value="其他">其他</option>
                            <option value="2026年7月新番">2026年7月新番</option>

                            <option value="日劇">日劇</option>

                        <input type="text" id="drama-category" class="form-control form-control-sm mt-2 d-none" placeholder="請輸入自訂分類名稱" value="其他">

                    <div class="row mb-2">
                        <div class="col-6">

                    <div class="mb-2">
                        <label class="form-label fw-bold small">預覽圖連結 (可輸入多個，每行一個)</label>
                        <textarea id="drama-image-url" class="form-control form-control-sm" rows="2" placeholder="https://d28s5ztqvkii64.cloudfront.net/images/...\nhttps://..." autocomplete="off"></textarea>

                    <div class="mb-2">
                        <label class="form-label fw-bold small d-flex justify-content-between align-items-center">
                            相關資訊連結
                            <button class="btn btn-xs btn-outline-success py-0 px-2" onclick="addLinkRow()"><i class="fa-solid fa-plus"></i></button>
                        </label>
                        <div id="link-rows-container" class="d-flex flex-column gap-2 mt-1"></div>
                    </div>

                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-line px-4" onclick="submitDramaForm()">送出儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 推薦劇集 Modal -->
    <div class="modal fade" id="recommendModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-success"><i class="fa-solid fa-share-nodes me-1"></i>推薦劇集給好友</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="rec-drama-id">
                    <div class="mb-2">
                        <label class="form-label fw-bold small">被推薦劇集</label>
                        <input type="text" id="rec-drama-title" class="form-control" disabled>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-bold small">選擇好友 (複選)</label>
                        <div id="rec-friends-checkboxes" class="border p-2 rounded" style="max-height: 120px; overflow-y: auto;">

                        </div>

                        <label class="form-label fw-bold small">推薦心得與短評</label>

                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-line px-4" onclick="submitRecommendForm()">發送推薦</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏預覽圖 Lightbox Overlay -->
    <div id="imageLightboxOverlay" class="position-fixed top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center" style="z-index: 10000; background: rgba(0, 0, 0, 0.94); backdrop-filter: blur(8px);" onclick="handleLightboxBackdropClick(event)">
        <!-- 頂部列：圖片計數與關閉按鈕 -->
        <div class="position-absolute top-0 start-0 w-100 d-flex justify-content-between align-items-center px-3 py-3" style="z-index: 10002; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);">
            <span id="lightbox-badge" class="badge bg-dark bg-opacity-75 text-white px-3 py-2 fs-6 rounded-pill border border-secondary shadow-sm">1 / 1</span>
            <button type="button" class="btn text-white fs-3 p-1 lh-1 border-0" onclick="closeLightbox()" style="text-shadow: 0 2px 8px rgba(0,0,0,0.8); cursor: pointer;" title="關閉">✕</button>
        </div>
        
        <!-- 切換按鈕 (左右) -->
        <button id="lightbox-prev-btn" type="button" class="btn text-white position-absolute top-50 start-0 translate-middle-y ms-2 d-flex align-items-center justify-content-center border-0 rounded-circle shadow-lg" style="width: 44px; height: 44px; background: rgba(0,0,0,0.6); font-size: 1.8rem; z-index: 10002; display: none;" onclick="navigateLightbox(-1)">‹</button>
        <button id="lightbox-next-btn" type="button" class="btn text-white position-absolute top-50 end-0 translate-middle-y me-2 d-flex align-items-center justify-content-center border-0 rounded-circle shadow-lg" style="width: 44px; height: 44px; background: rgba(0,0,0,0.6); font-size: 1.8rem; z-index: 10002; display: none;" onclick="navigateLightbox(1)">›</button>
        
        <!-- 圖片滾動區域 (全屏滑動) -->
        <div id="lightbox-carousel" class="d-flex align-items-center w-100 h-100" style="overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;" onscroll="onLightboxScroll(this)">
            <!-- 動態插入全屏圖片 -->
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let liffId = "{{ liff_id }}";
        let apiBaseUrl = "{{ request.scheme }}://{{ request.get_host }}";
        let userAccessToken = null;
        let lineContext = null;

        // 分頁與狀態變數
        let currentTab = "my_dramas";
        let myDramasPage = 1;
        let myDramasPageSize = 10;
        let recsPage = 1;
        let recsPageSize = 10;
        let allDramasPage = 1;
        let allDramasPageSize = 10;

        // 全前前端資料庫 Master Lists
        let myDramasMasterList = null;
        let allDramasMasterList = null;
        let recsMasterList = null;

        let displayPrefs = {
            category: true,
            links: true,
            total: true,
            creator: true
        };

        // 快捷分類面板折疊狀態
        let mainCategoryCollapsed = false;
        let tvSubExpanded = false;
        let movieSubExpanded = false;
        let cachedCategoriesData = null;

        // 好友快取
        let myFriendsList = [];

        document.addEventListener("DOMContentLoaded", function() {
            loadDisplaySettings();
            initLiff();
        });

        // 規範化搜尋文字輔助函數 (忽略大小寫、空格、書名號、波浪號、冒號等所有符號)
        function normalizeSearchText(text) {
            if (!text) return "";
            return text.toString().toLowerCase().replace(/[\s《》『』~∼〜〰⁓:：!！?？\-_—–]/g, "");
        }

        // 大類面板整體折疊/展開
        function toggleMainCategorySection() {
            mainCategoryCollapsed = !mainCategoryCollapsed;
            const container = document.getElementById("main-cat-container");
            const icon = document.getElementById("main-cat-toggle-icon");
            if (mainCategoryCollapsed) {
                container.classList.add("d-none");
                icon.innerHTML = `<i class="fa-solid fa-chevron-down me-1"></i>展開面板`;
            } else {
                container.classList.remove("d-none");
                icon.innerHTML = `<i class="fa-solid fa-chevron-up me-1"></i>折疊面板`;
            }
        }

        // 判斷是否屬於 NEW 提醒類別：
        // TV：2026年7月(含)之後 + "動畫化決定"
        // 劇場版：2026年(含)之後 + "日本動畫電影製作決定"
        function isNewCategory(cat) {
            if (!cat) return false;
            if (cat === "動畫化決定" || cat === "日本動畫電影製作決定") return true;

            // TV 季番判定
            const tvMatch = cat.match(/^(\d{4})年(\d{1,2})月/);
            if (tvMatch) {
                const year = parseInt(tvMatch[1]);
                const month = parseInt(tvMatch[2]);
                if (year > 2026 || (year === 2026 && month >= 7)) {
                    return true;
                }
            }

            // 劇場版/電影判定
            const movieMatch = cat.match(/^(\d{4})年.*電影/);
            if (movieMatch) {
                const year = parseInt(movieMatch[1]);
                if (year >= 2026) {
                    return true;
                }
            }
            return false;
        }

        // 取得目前使用者的獨立已讀標籤 Storage Key
        function getReadTagsKey() {
            let uid = "universal_user";
            if (typeof userProfile !== "undefined" && userProfile && userProfile.userId) {
                uid = userProfile.userId;
            } else if (userAccessToken && userAccessToken.length > 5) {
                uid = userAccessToken.substring(0, 15);
            }
            return "drama_read_new_tags_" + uid;
        }

        function getReadTags() {
            try {
                const data = localStorage.getItem(getReadTagsKey());
                return data ? JSON.parse(data) : [];
            } catch(e) {
                return [];
            }
        }

        function markTagsAsRead(tagsArray) {
            const readList = new Set(getReadTags());
            tagsArray.forEach(t => readList.add(t));
            try {
                localStorage.setItem(getReadTagsKey(), JSON.stringify(Array.from(readList)));
            } catch(e) {}
        }

        // 細項折疊/展開控制 (點擊大選項標題列即把當前所有 NEW 細項設為已讀，100% 消除 NEW 徽章)
        function toggleCategorySubItems(type) {
            if (cachedCategoriesData) {
                const fullList = (cachedCategoriesData.categories || []).concat(cachedCategoriesData.my_categories || []);
                if (type === 'tv') {
                    tvSubExpanded = !tvSubExpanded;
                    const newTvTags = fullList.filter(c => !c.includes("電影") && !c.includes("劇場版") && isNewCategory(c));
                    markTagsAsRead(newTvTags);
                } else if (type === 'movie') {
                    movieSubExpanded = !movieSubExpanded;
                    const newMovieTags = fullList.filter(c => (c.includes("電影") || c.includes("劇場版")) && isNewCategory(c));
                    markTagsAsRead(newMovieTags);
                }
                renderVisualChips(cachedCategoriesData);
            }
        }

        // 渲染細項 Chips (預設前 5 項，按右側按鈕展開/折疊，顯示個人化 NEW 提醒徽章)
        function renderVisualChips(data) {
            cachedCategoriesData = data;
            const tvContainer = document.getElementById("tv-cat-chips");
            const movieContainer = document.getElementById("movie-cat-chips");
            if (!tvContainer || !movieContainer) return;

            tvContainer.innerHTML = "";
            movieContainer.innerHTML = "";

            const tvCats = [];
            const movieCats = [];
            const readTags = new Set(getReadTags());

            const catList = (currentTab === 'my_dramas' && data.my_categories) ? data.my_categories : data.categories;
            const countsObj = (currentTab === 'my_dramas') ? data.my_counts : data.all_counts;

            catList.forEach(cat => {
                if (cat.includes("電影") || cat.includes("劇場版")) {
                    movieCats.push(cat);
                } else {
                    tvCats.push(cat);
                }
            });

            // 將「動畫化決定」與「日本動畫電影製作決定」置頂放到最前面
            const tvUnknownIdx = tvCats.indexOf("動畫化決定");
            if (tvUnknownIdx > -1) {
                tvCats.splice(tvUnknownIdx, 1);
                tvCats.unshift("動畫化決定");
            }

            const movieUnknownIdx = movieCats.indexOf("日本動畫電影製作決定");
            if (movieUnknownIdx > -1) {
                movieCats.splice(movieUnknownIdx, 1);
                movieCats.unshift("日本動畫電影製作決定");
            }

            // 1. 渲染季番動畫 Chips (預設前 5 項)
            const tvVisible = tvSubExpanded ? tvCats : tvCats.slice(0, 5);
            tvVisible.forEach(cat => {
                const count = countsObj ? (countsObj[cat] || 0) : 0;
                const isNew = isNewCategory(cat);
                const isUnread = isNew && !readTags.has(cat);
                const btn = document.createElement("button");
                btn.className = "btn btn-sm btn-outline-primary rounded-pill py-0 px-2 small position-relative";
                btn.style.fontSize = "0.75rem";
                
                let badgeHtml = isUnread ? `<span class="badge badge-new-pulse ms-1">NEW</span>` : `<span class="badge bg-primary text-white ms-1">${count}</span>`;
                btn.innerHTML = `${cat} ${badgeHtml}`;
                btn.onclick = function() {
                    if (isNew) markTagsAsRead([cat]);
                    selectCategoryFromChip(cat);
                    renderVisualChips(cachedCategoriesData);
                };
                tvContainer.appendChild(btn);
            });

            const tvToggleBtn = document.getElementById("toggle-tv-btn");
            const tvToggleLabel = document.getElementById("tv-toggle-label");
            if (tvCats.length <= 5) {
                tvToggleBtn.classList.add("d-none");
            } else {
                tvToggleBtn.classList.remove("d-none");
                if (tvSubExpanded) {
                    tvToggleLabel.innerText = "折疊收起 (全" + tvCats.length + "項)";
                    tvToggleBtn.querySelector("i").className = "fa-solid fa-angle-up me-1";
                } else {
                    tvToggleLabel.innerText = "展開更多細項 (共" + tvCats.length + "項)";
                    tvToggleBtn.querySelector("i").className = "fa-solid fa-angle-down me-1";
                }
            }

            // 2. 渲染動畫電影 Chips (預設前 5 項)
            const movieVisible = movieSubExpanded ? movieCats : movieCats.slice(0, 5);
            movieVisible.forEach(cat => {
                const count = countsObj ? (countsObj[cat] || 0) : 0;
                const isNew = isNewCategory(cat);
                const isUnread = isNew && !readTags.has(cat);
                const btn = document.createElement("button");
                btn.className = "btn btn-sm btn-outline-danger rounded-pill py-0 px-2 small position-relative";
                btn.style.fontSize = "0.75rem";
                
                let badgeHtml = isUnread ? `<span class="badge badge-new-pulse ms-1">NEW</span>` : `<span class="badge bg-danger text-white ms-1">${count}</span>`;
                btn.innerHTML = `${cat} ${badgeHtml}`;
                btn.onclick = function() {
                    if (isNew) markTagsAsRead([cat]);
                    selectCategoryFromChip(cat);
                    renderVisualChips(cachedCategoriesData);
                };
                movieContainer.appendChild(btn);
            });

            const movieToggleBtn = document.getElementById("toggle-movie-btn");
            const movieToggleLabel = document.getElementById("movie-toggle-label");
            if (movieCats.length <= 5) {
                movieToggleBtn.classList.add("d-none");
            } else {
                movieToggleBtn.classList.remove("d-none");
                if (movieSubExpanded) {
                    movieToggleLabel.innerText = "折疊收起 (全" + movieCats.length + "項)";
                    movieToggleBtn.querySelector("i").className = "fa-solid fa-angle-up me-1";
                } else {
                    movieToggleLabel.innerText = "展開更多細項 (共" + movieCats.length + "項)";
                    movieToggleBtn.querySelector("i").className = "fa-solid fa-angle-down me-1";
                }
            }
        }

        function selectCategoryFromChip(cat) {
            let selectId = "all-dramas-cat-select";
            if (currentTab === "my_dramas") {
                selectId = "my-dramas-cat-select";
            }
            const selectEl = document.getElementById(selectId);
            if (selectEl) {
                selectEl.value = cat;
                if (currentTab === "my_dramas") {
                    triggerMyDramasSearch();
                } else {
                    triggerAllDramasSearch();
                }
                setTimeout(() => {
                    selectEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 50);
            }
        }

        let userProfile = null;

        function initLiff() {
            liff.init({ liffId: liffId })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        userAccessToken = liff.getAccessToken();
                        lineContext = liff.getContext();

                        // 獲取使用者個人資料並設定問候語
                        liff.getProfile().then(profile => {
                            userProfile = profile;
                            const el = document.getElementById("user-display-name") || document.getElementById("user-name");
                            if (el) el.innerText = profile.displayName;
                            if (profile.pictureUrl) {
                                const avatarEl = document.getElementById("user-avatar-container");
                                if (avatarEl) avatarEl.innerHTML = `<img src="${profile.pictureUrl}" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">`;
                            }
                            if (cachedCategoriesData) {
                                renderVisualChips(cachedCategoriesData);
                            }
                        }).catch(err => {
                            console.error("Failed to get profile", err);
                        });

                        // 抓取好友關係與追劇列表
                        fetchFriends();
                        fetchDramas("my_dramas", 1);
                        fetchDramas("recommendations", 1);
                        fetchDramas("all_dramas", 1);
                        fetchCategories();
                    }
                })
                .catch((err) => {
                    console.error("LIFF initialization failed", err);
                    // 外部瀏覽器降級支援
                    fetchCategories();
                    fetchDramas("my_dramas", 1);
                    fetchDramas("all_dramas", 1);
                });
        }

        // 讀取/儲存顯示設定
        function loadDisplaySettings() {
            const saved = localStorage.getItem("drama_display_settings");
            if (saved) {
                try {
                    displayPrefs = JSON.parse(saved);
                } catch(e) {}
            }
            document.getElementById("pref-category-chk").checked = displayPrefs.category;
            document.getElementById("pref-links-chk").checked = displayPrefs.links;
            document.getElementById("pref-total-chk").checked = displayPrefs.total;
            document.getElementById("pref-creator-chk").checked = displayPrefs.creator;
        }

        function openDisplaySettingsModal() {
            const modal = new bootstrap.Modal(document.getElementById("displaySettingsModal"));
            modal.show();
        }

        function saveDisplaySettings() {
            displayPrefs.category = document.getElementById("pref-category-chk").checked;
            displayPrefs.links = document.getElementById("pref-links-chk").checked;
            displayPrefs.total = document.getElementById("pref-total-chk").checked;
            displayPrefs.creator = document.getElementById("pref-creator-chk").checked;
            localStorage.setItem("drama_display_settings", JSON.stringify(displayPrefs));
            
            // 關閉並重新渲染
            bootstrap.Modal.getInstance(document.getElementById("displaySettingsModal")).hide();
            fetchDramas("my_dramas", myDramasPage);
        }

        // 切換 Tab
        function switchTab(tab) {
            currentTab = tab;
            if (tab === "my_dramas") {
                fetchDramas("my_dramas", myDramasPage);
                fetchCategories();
            } else if (tab === "recommendations") {
                fetchDramas("recommendations", recsPage);
            } else if (tab === "all_dramas") {
                fetchDramas("all_dramas", allDramasPage);
                fetchCategories();
            }
        }

        // 讀取追劇列表或推薦 (一次性載入全量 MasterList，隨後於前端實施 0 毫秒極速搜尋與分頁)
        function fetchDramas(tab, page, forceReload = false) {
            let masterList = null;
            if (tab === "my_dramas") masterList = myDramasMasterList;
            else if (tab === "all_dramas") masterList = allDramasMasterList;
            else if (tab === "recommendations") masterList = recsMasterList;

            // 若已有 MasterList 且不強制重載，直接執行前端極速渲染
            if (masterList && !forceReload) {
                renderClientSideFilteredData(tab, page);
                return;
            }

            let listContainerId = "my-dramas-list";
            if (tab === "recommendations") listContainerId = "recs-list";
            else if (tab === "all_dramas") listContainerId = "all-dramas-list";
            
            const listContainer = document.getElementById(listContainerId);
            listContainer.innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            `;

            // 向後端請求全量 MasterList (帶入大 page_size)
            const reqBody = {
                access_token: userAccessToken,
                tab: tab,
                page: 1,
                page_size: 10000
            };

            fetch(apiBaseUrl + "/line/api/dramas/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(reqBody)
            })
            .then(res => res.json())
            .then(data => {
                if (tab === "my_dramas") {
                    document.getElementById("loading-section").classList.add("d-none");
                    document.getElementById("main-section").classList.remove("d-none");
                }
                if (data.status === "success") {
                    if (tab === "my_dramas") myDramasMasterList = data.list || [];
                    else if (tab === "all_dramas") allDramasMasterList = data.list || [];
                    else if (tab === "recommendations") recsMasterList = data.list || [];
                    
                    renderClientSideFilteredData(tab, page);
                } else {
                    listContainer.innerHTML = `<div class="alert alert-danger text-center small py-2">載入失敗：${data.error}</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                listContainer.innerHTML = `<div class="alert alert-danger text-center small py-2">伺服器連線失敗</div>`;
            });
        }

        // 前端 0 毫秒極速過濾、搜尋與分頁切片渲染
        function renderClientSideFilteredData(tab, targetPage) {
            let masterList = [];
            let searchInputId = "all-dramas-search";
            let catSelectId = "all-dramas-cat-select";
            let pageSize = allDramasPageSize;
            let page = targetPage || allDramasPage;

            if (tab === "my_dramas") {
                masterList = myDramasMasterList || [];
                searchInputId = "my-dramas-search";
                catSelectId = "my-dramas-cat-select";
                pageSize = myDramasPageSize;
                page = targetPage || myDramasPage;
            } else if (tab === "recommendations") {
                masterList = recsMasterList || [];
                pageSize = recsPageSize;
                page = targetPage || recsPage;
            } else {
                masterList = allDramasMasterList || [];
            }

            const searchInput = document.getElementById(searchInputId);
            const catSelect = document.getElementById(catSelectId);
            const rawQ = searchInput ? searchInput.value.trim() : "";
            const normQ = normalizeSearchText(rawQ);
            const catVal = catSelect ? catSelect.value.trim() : "";

            // 前端 0ms 記憶體過濾
            const filteredList = masterList.filter(item => {
                if (catVal && item.category !== catVal) return false;
                if (normQ) {
                    const normTitle = normalizeSearchText(item.title);
                    if (!normTitle.includes(normQ)) return false;
                }
                return true;
            });

            const totalCount = filteredList.length;
            const totalPages = Math.ceil(totalCount / pageSize) || 1;
            
            if (page > totalPages) page = totalPages;
            if (page < 1) page = 1;

            if (tab === "my_dramas") myDramasPage = page;
            else if (tab === "all_dramas") allDramasPage = page;
            else if (tab === "recommendations") recsPage = page;

            const start = (page - 1) * pageSize;
            const end = start + pageSize;
            const slicedList = filteredList.slice(start, end);
            const hasMore = page < totalPages;

            renderDramaList(slicedList, tab);
            updatePaginationControls(tab, page, totalPages, totalCount, hasMore);
        }

        // 分頁控制 (動態頁數、每頁筆數與跳頁選單)
        function updatePaginationControls(tab, page, totalPages, totalCount, hasMore) {
            let prefix = "my";
            if (tab === "recommendations") {
                prefix = "recs";
            } else if (tab === "all_dramas") {
                prefix = "all";
            }
            const paginationDiv = document.getElementById(`${prefix}-pagination`);
            const pageNumSpan = document.getElementById(`${prefix}-page-num`);
            const totalPagesSpan = document.getElementById(`${prefix}-total-pages`);
            const totalCountSpan = document.getElementById(`${prefix}-total-count`);
            const prevBtn = document.getElementById(`${prefix}-prev-btn`);
            const nextBtn = document.getElementById(`${prefix}-next-btn`);
            const jumpSelect = document.getElementById(`${prefix}-jump-page-select`);

            if (pageNumSpan) pageNumSpan.innerText = page;
            if (totalPagesSpan) totalPagesSpan.innerText = totalPages;
            if (totalCountSpan) totalCountSpan.innerText = totalCount;

            if (prevBtn) prevBtn.disabled = (page <= 1);
            if (nextBtn) nextBtn.disabled = !hasMore && (page >= totalPages);

            // 填補跳頁 Dropdown <option>
            if (jumpSelect) {
                jumpSelect.innerHTML = "";
                for (let i = 1; i <= totalPages; i++) {
                    const opt = document.createElement("option");
                    opt.value = i;
                    opt.innerText = `第 ${i} 頁`;
                    if (i === page) opt.selected = true;
                    jumpSelect.appendChild(opt);
                }
            }

            if (paginationDiv) {
                if (totalPages >= 1 || totalCount > 0) {
                    paginationDiv.classList.remove("d-none");
                    paginationDiv.classList.add("d-flex");
                } else {
                    paginationDiv.classList.add("d-none");
                    paginationDiv.classList.remove("d-flex");
                }
            }
        }

        // 修改每頁顯示筆數 (前端0ms即時分頁)
        function changePageSize(newSize) {
            const size = parseInt(newSize);
            if (currentTab === "my_dramas") {
                myDramasPageSize = size;
                myDramasPage = 1;
                renderClientSideFilteredData("my_dramas", 1);
            } else if (currentTab === "recommendations") {
                recsPageSize = size;
                recsPage = 1;
                renderClientSideFilteredData("recommendations", 1);
            } else if (currentTab === "all_dramas") {
                allDramasPageSize = size;
                allDramasPage = 1;
                renderClientSideFilteredData("all_dramas", 1);
            }
        }

        // 直接跳轉至指定頁數 (前端0ms即時跳轉)
        function jumpToPage(targetPage) {
            const page = parseInt(targetPage);
            if (isNaN(page) || page < 1) return;

            if (currentTab === "my_dramas") {
                myDramasPage = page;
                renderClientSideFilteredData("my_dramas", page);
            } else if (currentTab === "recommendations") {
                recsPage = page;
                renderClientSideFilteredData("recommendations", page);
            } else if (currentTab === "all_dramas") {
                allDramasPage = page;
                renderClientSideFilteredData("all_dramas", page);
            }
        }

        function changePage(offset) {
            if (currentTab === "my_dramas") {
                myDramasPage += offset;
                if (myDramasPage < 1) myDramasPage = 1;
                renderClientSideFilteredData("my_dramas", myDramasPage);
            } else if (currentTab === "recommendations") {
                recsPage += offset;
                if (recsPage < 1) recsPage = 1;
                renderClientSideFilteredData("recommendations", recsPage);
            } else if (currentTab === "all_dramas") {
                allDramasPage += offset;
                if (allDramasPage < 1) allDramasPage = 1;
                renderClientSideFilteredData("all_dramas", allDramasPage);

        // 快捷：追劇+1集
        function addOneEpisode(id, curS, curE) {
            fetch(`/line/api/dramas/update_progress/${id}/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    access_token: userAccessToken,
                    current_season: curS,
                    current_episode: curE + 1
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    fetchDramas("my_dramas", myDramasPage);
                } else {
                    Swal.fire("錯誤", "更新進度失敗：" + data.error, "error");
                }
            });
        }

        function addLinkRow(title = "", url = "") {

        // 新增劇集
        // 全屏預覽圖 Lightbox 互動邏輯
        let currentLightboxUrls = [];
        let currentLightboxIndex = 0;

        function openLightbox(urls, initialIdx = 0) {
            if (!urls || urls.length === 0) return;
            currentLightboxUrls = urls;
            currentLightboxIndex = initialIdx;

            const overlay = document.getElementById("imageLightboxOverlay");
            const carousel = document.getElementById("lightbox-carousel");
            const prevBtn = document.getElementById("lightbox-prev-btn");
            const nextBtn = document.getElementById("lightbox-next-btn");
            const badge = document.getElementById("lightbox-badge");

            carousel.innerHTML = urls.map((u, i) => `
                <div class="d-flex align-items-center justify-content-center w-100 h-100 flex-shrink-0" style="scroll-snap-align: center; width: 100vw; height: 100vh;">
                    <img src="${u}" style="max-width: 95vw; max-height: 85vh; object-fit: contain; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.8);" alt="預覽圖 ${i+1}">
                </div>
            `).join('');

            if (urls.length > 1) {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
                badge.style.display = 'inline-block';
                badge.innerText = `${initialIdx + 1} / ${urls.length}`;
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                badge.style.display = 'none';
            }

            overlay.classList.remove("d-none");
            overlay.classList.add("d-flex");
            document.body.style.overflow = "hidden";

            setTimeout(() => {
                carousel.scrollLeft = initialIdx * carousel.clientWidth;
            }, 50);
        }

        function closeLightbox() {
            const overlay = document.getElementById("imageLightboxOverlay");
            if (overlay) {
                overlay.classList.remove("d-flex");
                overlay.classList.add("d-none");
            }
            document.body.style.overflow = "";
        }

        function handleLightboxBackdropClick(e) {
            if (e.target.id === 'imageLightboxOverlay' || e.target.classList.contains('w-100')) {
                closeLightbox();
            }
        }

        function navigateLightbox(dir) {
            const carousel = document.getElementById("lightbox-carousel");
            if (!carousel || currentLightboxUrls.length <= 1) return;
            
            let newIdx = currentLightboxIndex + dir;
            if (newIdx < 0) newIdx = 0;
            if (newIdx >= currentLightboxUrls.length) newIdx = currentLightboxUrls.length - 1;
            
            currentLightboxIndex = newIdx;
            carousel.scrollTo({
                left: newIdx * carousel.clientWidth,
                behavior: 'smooth'
            });
        }

        function onLightboxScroll(el) {
            if (!el || currentLightboxUrls.length <= 1) return;
            const idx = Math.round(el.scrollLeft / el.clientWidth);
            if (idx >= 0 && idx < currentLightboxUrls.length) {
                currentLightboxIndex = idx;
                const badge = document.getElementById("lightbox-badge");
                if (badge) {
                    badge.innerText = `${idx + 1} / ${currentLightboxUrls.length}`;
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            const overlay = document.getElementById("imageLightboxOverlay");
            if (overlay && !overlay.classList.contains("d-none")) {
                if (e.key === "Escape") closeLightbox();
                else if (e.key === "ArrowLeft") navigateLightbox(-1);
                else if (e.key === "ArrowRight") navigateLightbox(1);
            }
        });

        // 滑動切換多張預覽圖 (Carousel) 輔助函式
        function scrollCarousel(uid, direction, btn) {
            if (btn) event.stopPropagation();
            const el = document.getElementById(uid);
            if (el) {
                el.scrollBy({ left: direction * 85, behavior: 'smooth' });
            }
        }

        function updateCarouselBadge(uid, total, el) {
            const badge = document.getElementById(uid + '-badge');
            if (badge && el) {
                const idx = Math.round(el.scrollLeft / 85) + 1;

        function renderPreviewImagesHtml(imageUrlData) {
            let urls = [];
            if (Array.isArray(imageUrlData)) {
                urls = imageUrlData;
            } else if (typeof imageUrlData === 'string' && imageUrlData.trim()) {
                const str = imageUrlData.trim();
                if (str.startsWith('[')) {
                    try {
                        const arr = JSON.parse(str);
                        if (Array.isArray(arr)) urls = arr;
                    } catch(e) {
                        urls = str.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
                    }
                } else {
                    urls = str.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
                }
            }

            urls = urls.filter(u => u && typeof u === 'string');
            if (urls.length === 0) return '';

            const urlsJson = JSON.stringify(urls).replace(/"/g, '&quot;');

            if (urls.length === 1) {
                return `<img src="${urls[0]}" class="drama-cover me-3" style="width: 85px; height: 115px; object-fit: cover; border-radius: 8px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;" onclick="openLightbox(${urlsJson}, 0)" onerror="this.style.display='none';" alt="預覽圖">`;
            }

            const uid = 'carousel-' + Math.random().toString(36).substr(2, 9);
            const imgsHtml = urls.map((u, idx) => 
                `<img src="${u}" style="width: 85px; height: 115px; object-fit: cover; scroll-snap-align: start; flex-shrink: 0; border-radius: 8px; cursor: pointer;" onclick="openLightbox(${urlsJson}, ${idx})" onerror="this.style.display='none';" alt="預覽圖 ${idx+1}">`
            ).join('');

            return `
                <div class="drama-cover-carousel me-3 position-relative" style="width: 85px; height: 115px; flex-shrink: 0;">
                    <div id="${uid}" class="d-flex" style="width: 85px; height: 115px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); scrollbar-width: none; -ms-overflow-style: none;" onscroll="updateCarouselBadge('${uid}', ${urls.length}, this)">
                        ${imgsHtml}
                    </div>
                    <span id="${uid}-badge" class="badge bg-dark bg-opacity-75 text-white position-absolute" style="bottom: 3px; right: 3px; font-size: 0.55rem; padding: 2px 4px; border-radius: 4px; pointer-events: none; backdrop-filter: blur(2px); z-index: 3;">1/${urls.length}</span>
                    <button type="button" class="btn p-0 text-white position-absolute top-50 start-0 translate-middle-y d-flex align-items-center justify-content-center" style="width: 16px; height: 26px; background: rgba(0,0,0,0.5); border: none; border-radius: 0 4px 4px 0; font-size: 0.75rem; z-index: 3; line-height: 1;" onclick="scrollCarousel('${uid}', -1, this)">‹</button>
                    <button type="button" class="btn p-0 text-white position-absolute top-50 end-0 translate-middle-y d-flex align-items-center justify-content-center" style="width: 16px; height: 26px; background: rgba(0,0,0,0.5); border: none; border-radius: 4px 0 0 4px; font-size: 0.75rem; z-index: 3; line-height: 1;" onclick="scrollCarousel('${uid}', 1, this)">›</button>
                </div>
            `;
        }

        function submitDramaForm() {
            const id = document.getElementById("edit-drama-id").value;
            const title = document.getElementById("drama-title").value;
            
            const selectEl = document.getElementById("drama-category-select");
            const inputEl = document.getElementById("drama-category");
            let finalCategory = inputEl.value.trim();
            if (selectEl.value !== "__custom__") {
                finalCategory = selectEl.value;
            }
            if (!finalCategory) {
                finalCategory = "其他";
            }

            const totalSeasons = document.getElementById("drama-seasons").value;
            const totalEpisodes = document.getElementById("drama-episodes").value;
            const imageUrl = document.getElementById("drama-image-url").value.trim();

            if (!title) {
                alert("劇名不可空白！");
                return;
            }

            const linkRows = document.querySelectorAll(".link-row-item");
            const links = [];
            linkRows.forEach(row => {
                const lt = row.querySelector(".link-title").value;
                const lu = row.querySelector(".link-url").value;

                total_seasons: parseInt(totalSeasons),
                total_episodes: parseInt(totalEpisodes),
                info_links: links,
                image_url: imageUrl

                headers: { "Content-Type": "application/json" },

        // 探索劇庫：將特定劇集加入個人追劇清單
        function joinDrama(id, btnEl) {
            // --- 樂觀更新 UI (Optimistic Update) ---
            // 1. 立即把按鈕換成「已在清單」，防止重複點擊
            if (btnEl) {
                btnEl.disabled = true;
                btnEl.className = "btn btn-sm btn-secondary py-1 px-2 text-nowrap text-white";
                btnEl.style.cssText = "font-size: 0.75rem; cursor: default;";

            }
            // 2. 同步更新內存中的 allDramasMasterList，使切換頁面後按鈕狀態也正確
            if (allDramasMasterList) {
                const item = allDramasMasterList.find(d => d.drama_id === id);
                if (item) item.is_added = true;
            }

            fetch(`/line/api/dramas/join/${id}/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ access_token: userAccessToken })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    Swal.fire({ title: '成功加入個人清單！', icon: 'success', timer: 1000, showConfirmButton: false });
                    // 強制從伺服器重載「我的清單」以反映最新資料
                    myDramasMasterList = null;
                    fetchDramas("my_dramas", 1, true);
                } else {
                    Swal.fire("錯誤", "加入失敗：" + data.error, "error");
                    // 失敗時還原按鈕
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.className = "btn btn-sm btn-success py-1 px-2 text-nowrap";
                        btnEl.style.cssText = "font-size: 0.75rem;";
                        btnEl.innerHTML = '<i class="fa-solid fa-plus me-1"></i>加入清單';
                    }
                    if (allDramasMasterList) {
                        const item = allDramasMasterList.find(d => d.drama_id === id);
                        if (item) item.is_added = false;
                    }
                }
            })
            .catch(err => {
                console.error("joinDrama error:", err);
                // 網路錯誤時也還原
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.className = "btn btn-sm btn-success py-1 px-2 text-nowrap";
                    btnEl.style.cssText = "font-size: 0.75rem;";
                    btnEl.innerHTML = '<i class="fa-solid fa-plus me-1"></i>加入清單';
                }
                if (allDramasMasterList) {
                    const item = allDramasMasterList.find(d => d.drama_id === id);
                    if (item) item.is_added = false;
                }
            });
        }

        // 抓取所有唯一的分類並填入下拉選單 (分組：動畫類 vs 動畫電影類，由新至舊排序)
        function fetchCategories() {
            const url = apiBaseUrl + "/line/api/dramas/categories/";
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ access_token: userAccessToken })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("HTTP status " + res.status);
                }
                return res.json();
            })
            .then(data => {
                if (data.status === "success") {
                    // 計算總部數
                    let totalAll = 0;
                    if (data.all_counts) {
                        Object.values(data.all_counts).forEach(v => totalAll += v);
                    }
                    let totalMy = 0;
                    if (data.my_counts) {
                        Object.values(data.my_counts).forEach(v => totalMy += v);
                    }

                    // 輔助函數：將分類清單拆分為「動畫新番」與「動畫電影」兩個分組
                    function buildGroupedOptions(catList, countsObj) {
                        const tvCats = [];
                        const movieCats = [];
                        
                        catList.forEach(cat => {
                            if (cat.includes("電影") || cat.includes("劇場版")) {
                                movieCats.push(cat);
                            } else {
                                tvCats.push(cat);
                            }
                        });

                        const tvUnknownIdx = tvCats.indexOf("動畫化決定");
                        if (tvUnknownIdx > -1) {
                            tvCats.splice(tvUnknownIdx, 1);
                            tvCats.unshift("動畫化決定");
                        }

                        const movieUnknownIdx = movieCats.indexOf("日本動畫電影製作決定");
                        if (movieUnknownIdx > -1) {
                            movieCats.splice(movieUnknownIdx, 1);
                            movieCats.unshift("日本動畫電影製作決定");
                        }

                        let html = "";
                        if (tvCats.length > 0) {
                            html += `<optgroup label="📺 季番動畫 (由新至舊)">`;
                            tvCats.forEach(cat => {
                                const count = countsObj ? (countsObj[cat] || 0) : 0;
                                html += `<option value="${cat}">${cat} (${count}部)</option>`;
                            });
                            html += `</optgroup>`;
                        }
                        if (movieCats.length > 0) {
                            html += `<optgroup label="🎬 動畫電影 / 劇場版 (由新至舊)">`;
                            movieCats.forEach(cat => {
                                const count = countsObj ? (countsObj[cat] || 0) : 0;
                                html += `<option value="${cat}">${cat} (${count}部)</option>`;
                            });
                            html += `</optgroup>`;
                        }
                        return html;
                    }

                    // 1. 全部劇集的分類選單 (探索新番)
                    const searchSelect = document.getElementById("all-dramas-cat-select");
                    if (searchSelect) {
                        const currentVal = searchSelect.value;
                        searchSelect.innerHTML = `<option value="">所有分類 (${totalAll}部)</option>` + buildGroupedOptions(data.categories, data.all_counts);
                        searchSelect.value = currentVal;
                    }

                    // 2. 我的追劇分類選單 (個人清單：只顯示個人有追過的分類選項 count > 0)
                    const mySelect = document.getElementById("my-dramas-cat-select");
                    if (mySelect) {
                        const currentVal = mySelect.value;
                        const myCategoriesOnly = data.my_categories || data.categories.filter(cat => (data.my_counts && data.my_counts[cat] > 0));
                        mySelect.innerHTML = `<option value="">所有我的追劇 (${totalMy}部)</option>` + buildGroupedOptions(myCategoriesOnly, data.my_counts);
                        mySelect.value = currentVal;
                    }

                    // 渲染快捷年度視覺 Chips 導航面板 (季番 vs 電影，預設前5項)
                    renderVisualChips(data);
                    const modalSelect = document.getElementById("drama-category-select");
                    if (modalSelect) {
                        modalSelect.innerHTML = buildGroupedOptions(data.categories, null);
                        const customOpt = document.createElement("option");
                        customOpt.value = "__custom__";
                        customOpt.innerText = "➕ 自訂新分類...";
                        modalSelect.appendChild(customOpt);
                    }
                } else {
                    console.error("fetchCategories status error", data);
                }
            })
            .catch(err => {
                console.error("fetchCategories failed", err);
            });
        }

        // 切換自訂分類輸入框顯示
        function toggleCustomCategoryInput() {
            const selectEl = document.getElementById("drama-category-select");
            const inputEl = document.getElementById("drama-category");
            if (selectEl.value === "__custom__") {
                inputEl.classList.remove("d-none");
                inputEl.value = "";
                inputEl.focus();
            } else {
                inputEl.classList.add("d-none");
                inputEl.value = selectEl.value;
            }
        }

        // 探索新番即時搜尋與分類過濾
        let allDramasSearchTimeout = null;
        function triggerAllDramasSearch() {
            clearTimeout(allDramasSearchTimeout);
            allDramasSearchTimeout = setTimeout(() => {
                allDramasPage = 1;
                fetchDramas("all_dramas", 1);
            }, 300);
        }

        // 我的追劇即時搜尋與分類過濾
        let myDramasSearchTimeout = null;
        function triggerMyDramasSearch() {
            clearTimeout(myDramasSearchTimeout);
            myDramasSearchTimeout = setTimeout(() => {
                myDramasPage = 1;
                fetchDramas("my_dramas", 1);
            }, 300);
        }
    </script>
</body>
</html>
